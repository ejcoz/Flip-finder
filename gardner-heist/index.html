<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Slab;src:url(fonts/AlfaSlabOne-Regular.ttf);font-display:block}
@font-face{font-family:Sans;src:url(fonts/ArchivoBlack-Regular.ttf);font-display:block}
@font-face{font-family:Fat;src:url(fonts/BagelFatOne-Regular.ttf);font-display:block}
@font-face{font-family:Mono;src:url(fonts/JetBrainsMono.ttf);font-weight:100 800;font-display:block}
html,body{margin:0;background:#1b2236;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { clamp, lerp, seg, ss, eio, eo, ei, back, mulberry, hash, vnoise, TAU } from '/core/lib.js';

// ---------- frame & palette ----------
const W = 1080, H = 1920, DUR = 32.85, CAP_Y = 1248;
const P = '#efe5cf', N = '#1b2236', B = '#2d5ea6', G = '#e3ad37', R = '#d23c2c';
const cv = document.getElementById('c');
const VW = innerWidth, VH = innerHeight; cv.width = VW; cv.height = VH;
const ctx = cv.getContext('2d');
const SC = VW / W;
const fr = t => Math.floor(t * 30 + 1e-6);

// ---------- helpers ----------
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function halftone(c, { x0 = -400, y0 = -400, w = W + 800, h = H + 800, step = 22, angle = 15, color, f, k = 0.68, min = 0.05 }) {
  const a = angle * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
  const cx = x0 + w / 2, cy = y0 + h / 2, n = Math.ceil(Math.hypot(w, h) / step / 2) + 1;
  c.beginPath();
  for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) {
    const u = i * step, v = j * step, x = cx + u * ca - v * sa, y = cy + u * sa + v * ca;
    if (x < x0 - step || x > x0 + w + step || y < y0 - step || y > y0 + h + step) continue;
    const s = Math.min(1.12, f(x, y)); if (s < min) continue;
    const r = s * step * k; c.moveTo(x + r, y); c.arc(x, y, r, 0, TAU);
  }
  c.fillStyle = color; c.fill();
}
const radial = (cx, cy, R0, pw = 1.2, amp = 1) => (x, y) => amp * Math.pow(clamp(1 - Math.hypot(x - cx, y - cy) / R0), pw);
const flat = v => () => v;
function font(f, s) { return f === 'Mono' ? `800 ${s}px Mono` : `${s}px ${f}`; }
function fit(text, f, maxW, maxS) { ctx.font = font(f, 100); const w = ctx.measureText(text).width; return Math.min(maxS, 100 * maxW / w); }
function txt(c, s, x, y, o = {}) {
  c.save();
  c.font = font(o.f || 'Sans', o.s || 60); c.textAlign = o.align || 'center'; c.textBaseline = o.base || 'alphabetic';
  if (o.shadow) { c.fillStyle = o.shadow; if (o.sw) { c.lineWidth = o.sw; c.strokeStyle = o.shadow; c.lineJoin = 'round'; c.strokeText(s, x + (o.sd || 8), y + (o.sd || 8)); } c.fillText(s, x + (o.sd || 8), y + (o.sd || 8)); }
  if (o.sw) { c.lineWidth = o.sw; c.strokeStyle = o.stroke || N; c.lineJoin = 'round'; c.strokeText(s, x, y); }
  c.fillStyle = o.fill || N; c.fillText(s, x, y);
  c.restore();
}
function boil(c, t, seed) { const r = mulberry(seed * 977 + Math.floor(t * 10)); c.translate((r() - .5) * 3.2, (r() - .5) * 3.2); c.rotate((r() - .5) * 0.006); }
function shake(t, hits, amp, dur = 0.3) {
  let a = 0; for (const h of hits) if (t >= h && t < h + dur) a += amp * Math.pow(1 - (t - h) / dur, 2);
  if (!a) return [0, 0]; const f = fr(t); return [(hash(f * 1.7) - .5) * 2 * a, (hash(f * 3.1 + 5) - .5) * 2 * a];
}
// camera: zoom z about world point (cx,cy) which lands at screen centre
function cam(c, z = 1, cx = W / 2, cy = H / 2, sx = 0, sy = 0, rot = 0) {
  c.translate(W / 2 + sx, H / 2 + sy); if (rot) c.rotate(rot); c.scale(z, z); c.translate(-cx, -cy);
}
const w2s = (x, y, z = 1, cx = W / 2, cy = H / 2) => [W / 2 + (x - cx) * z, H / 2 + (y - cy) * z];
function bgFill(c, col) { c.fillStyle = col; c.fillRect(-1200, -1200, W + 2400, H + 2400); }

// ---------- figures ----------
function arm(c, sx, sy, a1, a2, w1 = 50) {
  const L1 = 150, L2 = 140;
  const ex = sx + Math.sin(a1) * L1, ey = sy + Math.cos(a1) * L1;
  const hx = ex + Math.sin(a2) * L2, hy = ey + Math.cos(a2) * L2;
  c.lineWidth = w1; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.stroke();
  c.lineWidth = w1 * 0.86; c.beginPath(); c.moveTo(ex, ey); c.lineTo(hx, hy); c.stroke();
  c.beginPath(); c.arc(hx, hy, w1 * 0.55, 0, TAU); c.fill();
}
function shield(c, x, y, s, col) {
  c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = col;
  c.beginPath(); c.moveTo(-18, -20); c.lineTo(-6, -24); c.lineTo(0, -20); c.lineTo(6, -24); c.lineTo(18, -20); c.lineTo(18, 0);
  c.quadraticCurveTo(18, 18, 0, 26); c.quadraticCurveTo(-18, 18, -18, 0); c.closePath(); c.fill();
  c.restore();
}
// police silhouette: origin = top-centre of the shoulders
function cop(c, x, y, s, o = {}) {
  c.save(); c.translate(x, y); c.scale(s, s);
  const col = o.col || N;
  c.fillStyle = col; c.strokeStyle = col; c.lineCap = 'round'; c.lineJoin = 'round';
  if (o.legs !== false) { rr(c, -80, 300, 72, 450, 24); c.fill(); rr(c, 8, 300, 72, 450, 24); c.fill(); }
  c.beginPath(); c.moveTo(-100, 22); c.quadraticCurveTo(-110, -4, -78, -8); c.lineTo(78, -8); c.quadraticCurveTo(110, -4, 100, 22);
  c.lineTo(88, 322); c.lineTo(-88, 322); c.closePath(); c.fill();
  c.fillRect(-22, -44, 44, 44);
  c.beginPath(); c.arc(0, -80, 48, 0, TAU); c.fill();
  const aL = o.armL || [-0.14, -0.06], aR = o.armR || [0.14, 0.06];
  arm(c, -94, 16, aL[0], aL[1]); arm(c, 94, 16, aR[0], aR[1]);
  // belt
  c.fillStyle = o.belt || col; c.fillRect(-90, 286, 180, 18); c.fillStyle = col;
  // cap
  c.save(); c.translate(0, -114 + (o.capLift || 0)); c.rotate(o.capTilt || 0);
  c.beginPath(); c.moveTo(-50, 14); c.lineTo(-66, -22); c.quadraticCurveTo(0, -50, 66, -22); c.lineTo(50, 14); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(-56, 10); c.quadraticCurveTo(0, 44, 56, 10); c.closePath(); c.fill();
  c.fillStyle = G; shield(c, 0, -6, 0.55, G);
  c.restore();
  // chest badge or a question mark
  const bm = o.badge || 'shield';
  if (bm === 'shield') shield(c, -48, 78, 1, G);
  else txt(c, '?', -48, 104, { f: 'Sans', s: 74, fill: o.qcol || G });
  c.restore();
}
// seated guard in profile, facing +x when dir = 1; origin = hip on the seat
function guardSeat(c, x, y, s, dir, t, seed) {
  c.save(); c.translate(x, y); c.scale(dir * s, s); boil(c, t, seed);
  c.fillStyle = B; c.fillRect(-70, 36, 250, 22); c.fillRect(-60, 58, 20, 360); c.fillRect(150, 58, 20, 360);
  c.fillStyle = N;
  rr(c, -52, -310, 104, 330, 44); c.fill();
  c.fillRect(-20, -340, 40, 40);
  c.beginPath(); c.arc(6, -380, 52, 0, TAU); c.fill();
  rr(c, -30, -46, 250, 84, 40); c.fill();
  rr(c, 168, -20, 74, 420, 32); c.fill();
  rr(c, 168, 360, 130, 46, 20); c.fill();
  c.restore();
}

// ---------- stamps ----------
const STAMPS = {};
function makeStamp(text, w, h, color, seed) {
  const c = document.createElement('canvas'); c.width = w + 40; c.height = h + 40; const g = c.getContext('2d'); g.translate(20, 20);
  g.strokeStyle = color; g.lineWidth = h * 0.07; rr(g, 0, 0, w, h, h * 0.14); g.stroke();
  g.lineWidth = h * 0.03; rr(g, h * 0.11, h * 0.11, w - h * 0.22, h - h * 0.22, h * 0.08); g.stroke();
  g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = font('Sans', 100); const s = Math.min(h * 0.62, 100 * (w * 0.78) / g.measureText(text).width);
  g.font = font('Sans', s); g.fillText(text, w / 2, h / 2 + s * 0.06);
  g.globalCompositeOperation = 'destination-out'; const r = mulberry(seed);
  for (let i = 0; i < w * h / 140; i++) { g.globalAlpha = 0.35 + r() * 0.65; g.beginPath(); g.arc(r() * w, r() * h, 0.5 + r() * 2.4, 0, TAU); g.fill(); }
  for (let i = 0; i < 6; i++) { g.globalAlpha = 0.5; g.beginPath(); g.ellipse(r() * w, r() * h, 10 + r() * 30, 3 + r() * 6, r() * 3, 0, TAU); g.fill(); }
  return c;
}
function stampAt(c, img, x, y, ang, t, t0, scl = 1) {
  if (t < t0) return;
  const p = t - t0; let s;
  if (p < 0.09) s = lerp(2.6, 1, ei(p / 0.09)); else s = 1 + 0.06 * Math.exp(-(p - 0.09) * 14) * Math.cos((p - 0.09) * 40);
  c.save(); c.translate(x, y); c.rotate(ang); c.scale(s * scl, s * scl); c.globalAlpha = 0.93;
  c.drawImage(img, -img.width / 2, -img.height / 2); c.restore();
}

// ---------- paper ----------
let PAPER;
function buildPaper() {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const t = document.createElement('canvas'); t.width = 45; t.height = 80; const tg = t.getContext('2d'); const id = tg.createImageData(45, 80); const r = mulberry(7);
  for (let i = 0; i < id.data.length; i += 4) { const v = 236 + r() * 19; id.data[i] = v; id.data[i + 1] = v - 3; id.data[i + 2] = v - 10; id.data[i + 3] = 255; }
  tg.putImageData(id, 0, 0); g.imageSmoothingEnabled = true; g.drawImage(t, 0, 0, W, H);
  const im = g.getImageData(0, 0, W, H), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * 16; d[i] += n; d[i + 1] += n; d[i + 2] += n - 1; }
  g.putImageData(im, 0, 0);
  const rg = g.createRadialGradient(W / 2, H / 2, H * 0.28, W / 2, H / 2, H * 0.72);
  rg.addColorStop(0, 'rgba(255,255,255,0)'); rg.addColorStop(1, 'rgba(140,120,95,0.38)'); g.fillStyle = rg; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(120,100,80,0.12)'; g.fillRect(0, H * 0.5 - 1, W, 2); g.fillStyle = 'rgba(255,255,255,0.3)'; g.fillRect(0, H * 0.5 + 1, W, 2);
  return c;
}
function grain(t) {
  const r = mulberry(1000 + Math.floor(t * 15));
  ctx.fillStyle = P; for (let i = 0; i < 240; i++) { const s = 1 + r() * 2.6; ctx.fillRect(r() * W, r() * H, s, s); }
  ctx.fillStyle = N; for (let i = 0; i < 60; i++) { const s = 1 + r() * 2; ctx.fillRect(r() * W, r() * H, s, s); }
}

// ---------- events (sound) ----------
const EV = [
  { t: 0.0, type: 'music_start' },
  { t: 4.00, type: 'buzz', d: 0.42 }, { t: 4.44, type: 'latch' }, { t: 4.58, type: 'slide' },
  { t: 9.66, type: 'knock_visual' },
  { t: 10.95, type: 'knock' }, { t: 11.13, type: 'knock' }, { t: 11.31, type: 'knock' },
  { t: 14.42, type: 'whoosh', d: 0.42 },
  { t: 16.46, type: 'buzz', d: 0.30 },
  { t: 17.58, type: 'stamp' },
  { t: 22.06, type: 'snick' },
  { t: 25.36, type: 'rip' }, { t: 25.62, type: 'slide' },
  { t: 27.23, type: 'thunk' },
  { t: 29.20, type: 'dust', d: 0.8 },
];

// ---------- scenes ----------
const KNOCKS = [9.66, 10.95, 11.13, 11.31];

function S1(c, t) { // the door
  const z = 1 + 0.06 * eio(t / 4.5);
  const [sx, sy] = shake(t, [4.0, 4.44], 7, 0.35);
  cam(c, z, 540, 1000, sx, sy);
  bgFill(c, N);
  // bricks
  c.strokeStyle = B; c.lineWidth = 3;
  for (let row = 0; row < 40; row++) {
    const y = -300 + row * 62; c.beginPath(); c.moveTo(-400, y); c.lineTo(1500, y); c.stroke();
    for (let col = -4; col < 14; col++) { const x = col * 150 + (row % 2) * 75; c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + 62); c.stroke(); }
  }
  // ground
  c.fillStyle = N; c.fillRect(-400, 1585, 1900, 900);
  halftone(c, { x0: -400, y0: 1585, w: 1900, h: 700, step: 22, angle: 30, color: B, f: (x, y) => 0.25 + 0.4 * seg(y, 1585, 1950) });
  const open = eio(seg(t, 3.98, 4.5));
  const flick = 0.82 + 0.18 * vnoise(t * 7) - (t > 1.6 && t < 1.72 ? 0.25 : 0);
  // light spill on ground
  c.save(); c.beginPath(); c.moveTo(300, 1585); c.lineTo(780, 1585); c.lineTo(780 + 260 + 300 * open, 2300); c.lineTo(300 - 260 - 300 * open, 2300); c.closePath(); c.clip();
  halftone(c, { x0: -300, y0: 1585, w: 1700, h: 700, step: 22, angle: 45, color: G, f: (x, y) => (0.55 + 0.5 * open) * flick * clamp(1 - (y - 1585) / 520) });
  c.restore();
  // door frame and interior
  c.fillStyle = N; c.fillRect(270, 610, 540, 980);
  c.fillStyle = G; c.fillRect(300, 640, 480, 945);
  halftone(c, { x0: 300, y0: 640, w: 480, h: 945, step: 22, angle: 15, color: P, f: radial(560, 900, 600, 1.2, 1.1 * flick) });
  // door panel swings inward (hinge at left)
  const pw = 480 * Math.cos(open * 1.25);
  c.fillStyle = B; c.fillRect(300, 640, pw, 945);
  c.strokeStyle = N; c.lineWidth = 8; c.strokeRect(300, 640, pw, 945);
  if (pw > 40) {
    const gx = 300 + pw * 0.09, gw = pw * 0.82;
    c.fillStyle = G; c.fillRect(gx, 690, gw, 400);
    c.save(); c.beginPath(); c.rect(gx, 690, gw, 400); c.clip();
    halftone(c, { x0: gx, y0: 690, w: gw, h: 400, step: 22, angle: 15, color: P, f: radial(gx + gw * 0.55, 860, 420, 1.1, flick) });
    c.restore();
    c.lineWidth = 10; c.strokeRect(gx, 690, gw, 400);
    c.fillStyle = N; c.fillRect(300 + pw * 0.82, 1150, Math.max(6, pw * 0.1), 18);
  }
  // buzzer box
  c.fillStyle = P; rr(c, 836, 1010, 56, 86, 10); c.fill(); c.strokeStyle = N; c.lineWidth = 6; c.stroke();
  c.fillStyle = t > 3.98 && t < 4.5 ? R : N; c.beginPath(); c.arc(864, 1040, 12, 0, TAU); c.fill();
  if (t > 3.98 && t < 4.5) {
    c.strokeStyle = G; c.lineWidth = 7; const j = fr(t) % 2 ? 4 : -4;
    for (const s of [-1, 1]) { c.beginPath(); for (let i = 0; i < 5; i++) c.lineTo(864 + s * (52 + i * 16), 1030 + ((i % 2) ? -14 : 14) + j); c.stroke(); }
  }
  // two capped silhouettes
  const step = eio(seg(t, 4.08, 4.6));
  for (const [i, x0] of [[0, 395], [1, 690]]) {
    const br = 1 + 0.008 * Math.sin(t * 3 + i * 2);
    c.save(); boil(c, t, 11 + i);
    const look = i === 0 ? 0.04 * Math.sin(t * 1.3) : 0;
    cop(c, x0 + (i === 0 ? 40 : -40) * step, 860 - 30 * step, 1.0 * br, {
      armR: i === 1 ? [0.14 + 0.25 * seg(t, 1.2, 1.5) - 0.25 * seg(t, 2.6, 2.9), 0.06 + 0.9 * seg(t, 1.2, 1.5) - 0.9 * seg(t, 2.6, 2.9)] : undefined,
      capTilt: look,
    });
    c.restore();
  }
}

function S2(c, t) { // dossier card
  const lt = t - 4.5;
  const z = 1 + 0.075 * eio(lt / 4.4);
  cam(c, z, 540, 900, 0, 0, -0.012 * eio(lt / 4.4));
  bgFill(c, P);
  halftone(c, { step: 24, angle: 15, color: B, f: (x, y) => 0.9 * Math.pow(clamp(Math.hypot((x - 540) / 540, (y - 900) / 960) - 0.55), 1.3) * 2.2 });
  const sl = back(seg(t, 4.52, 4.98), 1.4);
  const cy = lerp(2300, 0, sl);
  c.save(); c.translate(0, cy - 150); c.translate(540, 760); c.rotate(-0.035 + 0.02 * (1 - sl)); c.translate(-540, -760);
  // shadow
  c.fillStyle = B; rr(c, 104, 404, 880, 750, 18); c.fill();
  // card body (manila = paper + gold dots)
  c.fillStyle = P; rr(c, 90, 390, 880, 750, 18); c.fill();
  c.save(); rr(c, 90, 390, 880, 750, 18); c.clip();
  halftone(c, { x0: 90, y0: 390, w: 880, h: 750, step: 20, angle: 45, color: G, f: flat(0.42) }); c.restore();
  c.strokeStyle = N; c.lineWidth = 6; rr(c, 90, 390, 880, 750, 18); c.stroke();
  // tab
  c.fillStyle = N; rr(c, 120, 340, 380, 70, 14); c.fill();
  txt(c, 'CASE No. 90-0318', 310, 388, { f: 'Mono', s: 30, fill: P });
  txt(c, 'INCIDENT REPORT', 140, 470, { f: 'Mono', s: 30, fill: N, align: 'left' });
  // photo of the building, paper-clipped
  c.save(); c.translate(800, 520); c.rotate(0.07);
  c.fillStyle = P; c.fillRect(-120, -100, 240, 210); c.strokeStyle = N; c.lineWidth = 5; c.strokeRect(-120, -100, 240, 210);
  c.fillStyle = N; c.fillRect(-105, -85, 210, 150);
  c.save(); c.beginPath(); c.rect(-105, -85, 210, 150); c.clip();
  halftone(c, { x0: -105, y0: -85, w: 210, h: 150, step: 14, angle: 20, color: B, f: flat(0.45) });
  c.fillStyle = P; c.fillRect(-80, -40, 160, 105);
  c.fillStyle = N; for (let fl = 0; fl < 3; fl++) for (let k = 0; k < 5; k++) { rr(c, -70 + k * 30, -30 + fl * 32, 18, 24, [9, 9, 0, 0]); c.fill(); }
  c.restore();
  c.strokeStyle = N; c.lineWidth = 6; c.beginPath(); c.roundRect(-30, -128, 26, 70, 12); c.stroke();
  c.restore();
  // big date, per-glyph pop
  const date = 'MARCH 18, 1990';
  const ds = fit(date, 'Fat', 760, 112);
  c.font = font('Fat', ds); let x = 540 - c.measureText(date).width / 2;
  for (let i = 0; i < date.length; i++) {
    const ch = date[i], wch = c.measureText(ch).width;
    const p = seg(t, 4.78 + i * 0.03, 4.78 + i * 0.03 + 0.3);
    if (p > 0) {
      const yy = 760 - 60 * (1 - back(p, 2)), sq = 1 + 0.25 * Math.exp(-p * 6) * Math.cos(p * 14);
      c.save(); c.translate(x + wch / 2, yy); c.scale(1 / sq, sq);
      txt(c, ch, 0, 0, { f: 'Fat', s: ds, fill: G, sw: 10, stroke: N, shadow: B, sd: 7 });
      c.restore();
    }
    x += wch;
  }
  c.fillStyle = N; c.fillRect(140, 810, 780 * eo(seg(t, 5.0, 5.4)), 6);
  const L = ['ISABELLA STEWART', 'GARDNER MUSEUM,', 'BOSTON'];
  L.forEach((s, i) => {
    const p = seg(t, 5.1 + i * 0.12, 5.45 + i * 0.12); if (p <= 0) return;
    c.save(); c.translate(140, 910 + i * 82 + 40 * (1 - back(p, 1.8)));
    txt(c, s, 0, 0, { f: 'Mono', s: 66, fill: i === 2 ? R : N, align: 'left' });
    c.restore();
  });
  c.restore();
}

function S3(c, t) { // clock + knock
  const lt = t - 8.9;
  const [sx, sy] = shake(t, KNOCKS, 9, 0.22);
  const z = 1 + 0.05 * eio(lt / 2.6);
  cam(c, z, 540, 960, sx, sy);
  bgFill(c, N);
  halftone(c, { step: 22, angle: 15, color: B, f: (x, y) => 0.3 + 0.2 * Math.sin(y / 300) });
  // glass of the door (bottom)
  c.fillStyle = N; c.fillRect(90, 780, 900, 1500);
  c.fillStyle = G; c.fillRect(130, 820, 820, 1400);
  c.save(); c.beginPath(); c.rect(130, 820, 820, 1400); c.clip();
  halftone(c, { x0: 130, y0: 820, w: 820, h: 1400, step: 22, angle: 15, color: P, f: radial(560, 1100, 700, 1.3, 0.95) });
  // ripples
  for (const k of KNOCKS) {
    const p = (t - k) / 0.9; if (p < 0 || p > 1) continue;
    const rr1 = 60 + 720 * eo(p), rr2 = rr1 * 0.55, fade = 1 - p;
    halftone(c, { x0: 130, y0: 820, w: 820, h: 1400, step: 20, angle: 45, color: N, k: 0.62, f: (x, y) => { const d = Math.hypot(x - 560, y - 1000); return fade * (Math.exp(-Math.pow((d - rr1) / 34, 2)) + 0.8 * Math.exp(-Math.pow((d - rr2) / 26, 2))); } });
  }
  c.restore();
  c.fillStyle = N; c.fillRect(530, 820, 20, 1400);

let HOOK_S = 110;
function hook(t) {
  if (t >= 4.5) return;
  const ys = [270, 400, 530];
  HOOK.forEach((line, i) => {
    const p = seg(t, i * 0.04, i * 0.04 + 0.22);
    const sq = 1 + 0.12 * (1 - p) * Math.cos(p * 9);
    ctx.save(); ctx.translate(70, ys[i]); ctx.scale(1, sq);
    txt(ctx, line, 0, 0, { f: 'Slab', s: HOOK_S, align: 'left', fill: i === 2 ? G : P, shadow: B, sd: 8 });
    ctx.restore();
  });
}
function hud(t) {
  const dark = !(t >= 4.5 && t < 8.9) && !(t >= 14.7 && t < 18.2) && !(t >= 25.85 && t < 30.0) && !(t >= 30.0);
  ctx.save();
  ctx.fillStyle = B; rr(ctx, 46, 54, 310, 54, 12); ctx.fill();
  ctx.fillStyle = N; rr(ctx, 40, 48, 310, 54, 12); ctx.fill(); if (dark) { ctx.strokeStyle = P; ctx.lineWidth = 3; ctx.stroke(); }
  txt(ctx, 'CASE 90-0318', 195, 86, { f: 'Mono', s: 28, fill: P });
  const right = t >= 30.0 ? 'TODAY' : 'MAR 18 1990';
  ctx.font = font('Mono', 28); const rw = ctx.measureText(right).width + 74;
  ctx.fillStyle = N; rr(ctx, W - 40 - rw, 48, rw, 54, 12); ctx.fill(); if (dark) { ctx.strokeStyle = P; ctx.lineWidth = 3; ctx.stroke(); }
  if (Math.floor(t * 2) % 2 === 0) { ctx.fillStyle = R; ctx.beginPath(); ctx.arc(W - 40 - rw + 28, 75, 10, 0, TAU); ctx.fill(); }
  txt(ctx, right, W - 40 - rw + 48, 86, { f: 'Mono', s: 28, fill: P, align: 'left' });
  ctx.restore();
}

// ---------- render ----------
function flash(t) {
  const p = t - 17.58; if (p < 0 || p > 0.25) return;
  ctx.fillStyle = `rgba(255,252,240,${0.5 * (1 - p / 0.25)})`; ctx.fillRect(0, 0, W, H);
}
window.DUR = DUR;
window.EV = EV;
window.CUES = CUES.map(c => ({ t0: +c.t0.toFixed(3), t1: +c.t1.toFixed(3), text: c.text }));
window.render = (t) => {
  t = clamp(t, 0, DUR - 1e-4);
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const sc = SCENES.find(s => t >= s[0] && t < s[1]);
  ctx.save(); sc[2](ctx, t); ctx.restore();
  if (t >= 11.5 && t < 14.7) bubble(ctx, t);
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  hook(t);
  hud(t);
  wipe(t);
  caption(t);
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(PAPER, 0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
  grain(t);
  flash(t);
};
window.TEXTS = (t) => {
  const L = [];
  L.push({ id: 'hud', text: 'CASE', x0: 40, y0: 48, x1: 1040, y1: 102, pass: true });
  if (t < 4.26) L.push({ id: 'hook', text: HOOK.join(' '), x0: 70, y0: 170, x1: 1010, y1: 560 });
  if (t >= 4.9 && t < 8.66) L.push({ id: 'date', text: 'MARCH 18, 1990', x0: 110, y0: 500, x1: 970, y1: 680 });
  if (t >= 5.5 && t < 8.66) { L.push({ id: 'm1', text: 'ISABELLA STEWART', x0: 100, y0: 700, x1: 990, y1: 800 }); L.push({ id: 'm2', text: 'GARDNER MUSEUM,', x0: 100, y0: 790, x1: 990, y1: 880 }); L.push({ id: 'm3', text: 'BOSTON', x0: 100, y0: 870, x1: 990, y1: 980 }); }
  if (t >= 4.6 && t < 8.66) L.push({ id: 'cardsmall', text: 'CASE No. 90-0318 INCIDENT REPORT', x0: 100, y0: 330, x1: 700, y1: 490, pass: true });
  if (t >= 9.3 && t < 11.26) L.push({ id: 'clock', text: '1:24 AM', x0: 360, y0: 640, x1: 720, y1: 740 });
  if (t >= 11.95 && t < 14.5) L.push({ id: 'bubble', text: 'DISTURBANCE CALL', x0: 230, y0: 350, x1: 890, y1: 590 });
  if (t >= 14.86 && t < 16.7) L.push({ id: 'door', text: 'DOOR', x0: 460, y0: 780, x1: 620, y1: 870 });
  if (t >= 17.58 && t < 18.2) L.push({ id: 'fake', text: 'FAKE', x0: 200, y0: 620, x1: 880, y1: 940, pass: true });
  if (t >= 16.7 && t < 18.2) L.push({ id: 'plates', text: 'SUSPECT 1 SUSPECT 2', x0: 160, y0: 1430, x1: 920, y1: 1520, pass: true });
  if (t >= 20.15 && t < 22.3) L.push({ id: 'timer', text: 'timer', x0: 180, y0: 280, x1: 900, y1: 660, pass: true });
  if (t >= 25.85 && t < 27.5) L.push({ id: 'tiles', text: 'STOLEN EXHIBIT LIST', x0: 60, y0: 300, x1: 1020, y1: 1130, pass: true });
  if (t >= 27.55 && t < 29.8) L.push({ id: 'amount', text: '$10,000,000', x0: 160, y0: 420, x1: 920, y1: 620 });
  if (t >= 27.55 && t < 29.8) L.push({ id: 'reward', text: 'REWARD', x0: 180, y0: 620, x1: 900, y1: 820 });
  if (t >= 27.55 && t < 29.8) L.push({ id: 'rewardsmall', text: 'BY ORDER', x0: 120, y0: 420, x1: 960, y1: 1080, pass: true });
  return L;
};

(async () => {
  await Promise.all([font('Slab', 40), font('Sans', 40), font('Fat', 40), font('Mono', 40)].map(f => document.fonts.load(f, 'AZaz09$,:?\'')));
  await document.fonts.ready;
  PAPER = buildPaper();
  STAMPS.fake = makeStamp('FAKE', 600, 250, R, 5);
  STAMPS.stolen = makeStamp('STOLEN', 300, 110, R, 9);
  HOOK_S = Math.min(...HOOK.map(l => fit(l, 'Slab', 930, 124)));
  window.render(0);
  window.READY = true;
})();
</script>
