<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Anton'; src: url(fonts/Anton-Regular.ttf) format('truetype'); font-display: block; }
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style>
</head><body><canvas id="c"></canvas>
<script type="module">
import { clamp, lerp, seg, ss, eio, eo, ei, back, mulberry, hash, TAU } from '/core/lib.js';

const W = innerWidth, H = innerHeight;            // 1080 × 1920
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
const G = 0.25;
const [cutC, cutX] = mk(W, H), [cutGC, cutG] = mk(W * G, H * G);
const [corC, corX] = mk(W, H), [corGC, corG] = mk(W * G, H * G);
const [tmpC, tmpX] = mk(W * G, H * G);

const TL = await (await fetch('timeline.json')).json();
window.DUR = TL.DUR;
const L = Object.fromEntries(TL.lines.map(l => [l.id, l]));
const wt = (id, word, n = 0) => { const ws = L[id].w.filter(x => x[0].toLowerCase().startsWith(word.toLowerCase())); return ws.length ? ws[Math.min(n, ws.length - 1)][1] : L[id].t; };

const P = { amber: '#F5A82A', red: '#FF2A2A', line: '#5A5A5A', bright: '#9A9A9A', white: '#FFFFFF' };
const FONT = n => `${n}px Anton, "Noto Color Emoji"`;

const T = {
  t100: wt('l01', '100'), tEmpty: wt('l01', 'empty'), titleOut: L.l02.t + .45,
  pull0: L.l02.t, deep: wt('l02', 'underground'), ret: wt('l02', 'everything'),
  push0: L.l03.t - .2, num: wt('l03', 'number'), name: wt('l03', 'name'), back0: L.l04.t - .2,
  counter: L.l04.t - .1, hush: L.l04.t + L.l04.d + .15, red: wt('l05', 'one'),
  dive0: L.l06.t - .1, dive1: L.l06.t + 1.05, six: wt('l06', '404'),
  knock1: wt('l07', 'knocked', 0), knock2: wt('l07', 'back'), back2a: L.l08.t - .35, back2b: L.l08.t + .75,
  pill: L.l08.t + .1, dont: wt('l09', "don't"), title2: L.l08.t + .9, end: TL.DUR
};

// ---------- the silo (wireframe cylinder) ----------
const CX = 540, TOP = 560, BOT = 1530, R = 322, RY = 34, NCOL = 44, ROWH = 36;
const NROW = Math.floor((BOT - TOP - 60) / ROWH);
const rot = t => .35 + t * .018;                     // slow turn
const YOU = { row: 14, col: 0 }, X404 = { row: 9, col: 0 };
// angular positions (fixed on the silo): the 404 cell sits front-left, yours front-right
const KYOU = Math.round(.18 / (TAU / NCOL)), K404 = ((Math.round(-1.25 / (TAU / NCOL)) % NCOL) + NCOL) % NCOL;
const ANG = { you: (KYOU + .5) * TAU / NCOL, x404: (K404 + .5) * TAU / NCOL };
const cellAng = (k) => k * TAU / NCOL;
function cellQuad(row, a0, a1, rt) {
  // returns screen-world polygon for a cell spanning angles a0..a1 on a row
  const y0 = TOP + 40 + row * ROWH, y1 = y0 + ROWH - 6;
  const pts = []; const N = 4;
  for (let i = 0; i <= N; i++) { const a = lerp(a0, a1, i / N) + rt; pts.push([CX + R * Math.sin(a), y0 + RY * Math.cos(a)]); }
  for (let i = N; i >= 0; i--) { const a = lerp(a0, a1, i / N) + rt; pts.push([CX + R * Math.sin(a), y1 + RY * Math.cos(a)]); }
  return pts;
}
const facing = a => Math.cos(a);

// ---------- camera ----------
const WIDE = { x: 540, y: 960, z: 1, r: 0 };
const logz = (a, b, u) => Math.exp(lerp(Math.log(a), Math.log(b), u));
const mixCam = (a, b, u, uz = u) => ({ x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: logz(a.z, b.z, uz), r: lerp(a.r, b.r, u) });
function cellCenterAt(t, row, ang) { const a = ang + rot(t), y = TOP + 40 + row * ROWH + (ROWH - 6) / 2; return [CX + R * Math.sin(a), y + RY * Math.cos(a)]; }
function camAt(t) {
  const br = Math.sin(t * .6) * .006;
  const w = (z = 1) => ({ x: 540, y: 960 + Math.sin(t * .5) * 5, z, r: br });
  const UP = { x: 540, y: 520, z: .5, r: 0 };
  if (t < T.pull0) return mixCam({ ...w(), z: 1.07 }, w(), ss(seg(t, 0, T.pull0)));
  if (t < T.push0) { const u = eio(seg(t, T.pull0, T.deep + .4)), v = eio(seg(t, T.ret - .2, T.push0)); return mixCam(mixCam(w(), UP, u), w(), v); }
  const [yx, yy] = cellCenterAt(t, YOU.row, ANG.you);
  const YC = { x: yx, y: yy, z: 3.4, r: -.02 };
  if (t < T.back0) return mixCam(w(), YC, eio(seg(t, T.push0, T.push0 + 1.4)));
  if (t < T.hush) return mixCam(YC, w(), eio(seg(t, T.back0, T.back0 + 1.3)));
  const [rx, ry] = cellCenterAt(t, X404.row, ANG.x404);
  const RC = { x: lerp(540, rx, .45), y: lerp(960, ry, .45), z: 1.35, r: .02 };
  if (t < T.dive0) return mixCam(w(), RC, eio(seg(t, T.hush, T.dive0)));
  const D = { x: rx, y: ry, z: 78, r: 0 };
  if (t < T.back2a) return mixCam(RC, D, ss(seg(t, T.dive0, T.dive0 + .6)), ei(seg(t, T.dive0, T.dive1)));
  return mixCam(D, w(), ss(seg(t, T.back2a + .2, T.back2b + .2)), eo(seg(t, T.back2a, T.back2b + .3)));
}
function applyCam(c, cam, s = 1) { c.setTransform(s, 0, 0, s, 0, 0); c.translate(W / 2, H / 2); c.rotate(cam.r); c.scale(cam.z, cam.z); c.translate(-cam.x, -cam.y); }
function w2s(cam, x, y) { const dx = (x - cam.x) * cam.z, dy = (y - cam.y) * cam.z, c = Math.cos(cam.r), s = Math.sin(cam.r); return [W / 2 + dx * c - dy * s, H / 2 + dx * s + dy * c]; }

// ---------- helpers ----------
const TEXTS = [];
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function glowDot(c, x, y, r, col, a = 1) { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); c.globalAlpha = a; c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); c.globalAlpha = 1; }
function poly(c, pts) { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); }
function bloom(c, src, k) {
  tmpX.setTransform(1, 0, 0, 1, 0, 0); tmpX.clearRect(0, 0, W * G, H * G);
  tmpX.filter = 'blur(5px)'; tmpX.drawImage(src, 0, 0); tmpX.filter = 'blur(14px)'; tmpX.drawImage(src, 0, 0); tmpX.filter = 'none';
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'lighter'; c.globalAlpha = k; c.drawImage(tmpC, 0, 0, W, H); c.restore();
}

// ---------- the wide scene ----------
function state(t) {
  return {
    dim: t > T.hush && t < T.red ? ss(seg(t, T.hush, T.hush + .4)) * .45 : 0,
    red: t > T.red - .05 ? ss(seg(t, T.red - .05, T.red + .25)) : 0,
    you: t > T.name - .1 && t < T.red ? back(seg(t, T.name - .1, T.name + .3)) * (1 - ss(seg(t, T.hush, T.hush + .3))) : 0,
    nums: ss(seg(t, T.num - .5, T.num)) * (1 - ss(seg(t, T.back0, T.back0 + .6))),
    up: ss(seg(t, T.pull0 + .2, T.deep + .3)) * (1 - ss(seg(t, T.ret, T.push0)))
  };
}
function drawWide(t, cam, S) {
  const c = cutX, g = cutG;
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W * G, H * G);
  // faint vignette lift behind the silo
  const vg = c.createRadialGradient(W / 2, H * .52, 50, W / 2, H * .52, H * .7); vg.addColorStop(0, '#121212'); vg.addColorStop(1, '#000'); c.fillStyle = vg; c.fillRect(0, 0, W, H);
  applyCam(c, cam); applyCam(g, cam, G);
  // ground lines: strata + surface + depth ruler (line art)
  c.lineWidth = 1.5 / Math.max(.6, cam.z) * 1.2;
  for (let k = 0; k < 14; k++) {
    const y = -650 + k * 170 + (k % 3) * 20; if (y > TOP - 40 && y < BOT + 60) continue;
    c.strokeStyle = `rgba(90,90,90,${.18 + (k % 2) * .08})`; c.setLineDash([16, 14]); c.beginPath();
    for (let x = -900; x <= 1980; x += 60) c.lineTo(x, y + Math.sin(x * .006 + k) * 14); c.stroke();
  }
  c.setLineDash([]);
  c.strokeStyle = '#8A8A8A'; c.lineWidth = 3; c.beginPath(); c.moveTo(-1200, -760); c.lineTo(2300, -760); c.stroke();
  for (let x = -1200; x < 2300; x += 34) { c.beginPath(); c.moveTo(x, -760); c.lineTo(x - 14, -742); c.stroke(); }
  // shaft from surface to silo
  c.strokeStyle = P.line; c.lineWidth = 2; c.beginPath(); c.moveTo(510, -760); c.lineTo(510, TOP - RY); c.moveTo(570, -760); c.lineTo(570, TOP - RY); c.stroke();
  for (let y = -740; y < TOP - RY; y += 26) { c.beginPath(); c.moveTo(510, y); c.lineTo(570, y); c.stroke(); }
  // depth ruler
  if (S.up > .01) {
    c.save(); c.globalAlpha = S.up; c.strokeStyle = '#7A7A7A'; c.fillStyle = '#9A9A9A'; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(960, -760); c.lineTo(960, TOP); c.stroke();
    for (let k = 0; k <= 6; k++) { const y = lerp(-760, TOP, k / 6); c.beginPath(); c.moveTo(940, y); c.lineTo(980, y); c.stroke(); c.font = FONT(34); c.textAlign = 'left'; c.fillText(`-${k * 50} M`, 995, y + 12); }
    c.font = FONT(44); c.fillStyle = '#CFCFCF'; c.textAlign = 'center'; c.fillText('SURFACE', 540, -790);
    c.restore();
  }
  drawSilo(c, g, t, cam, S);
  c.setTransform(1, 0, 0, 1, 0, 0);
  bloom(c, cutGC, 1);
  if (S.dim > 0) { c.fillStyle = `rgba(0,0,0,${S.dim})`; c.fillRect(0, 0, W, H); }
}
function drawSilo(c, g, t, cam, S) {
  const rt = rot(t), lw = 1.6 / Math.sqrt(cam.z);
  // back edge of the top ellipse + body silhouette
  c.strokeStyle = '#6A6A6A'; c.lineWidth = 3 * lw;
  c.beginPath(); c.ellipse(CX, TOP, R, RY, 0, 0, TAU); c.stroke();
  c.beginPath(); c.moveTo(CX - R, TOP); c.lineTo(CX - R, BOT); c.moveTo(CX + R, TOP); c.lineTo(CX + R, BOT); c.stroke();
  c.beginPath(); c.ellipse(CX, BOT, R, RY, 0, 0, Math.PI); c.stroke();
  c.beginPath(); c.ellipse(CX, TOP + 22, R - 10, RY - 3, 0, 0, Math.PI); c.stroke();
  // base ribs
  for (let k = 0; k < NCOL; k++) { const a = cellAng(k) + rt + TAU / NCOL / 2, f = facing(a); if (f <= 0) continue; const x = CX + R * Math.sin(a), y = BOT + RY * Math.cos(a); c.strokeStyle = `rgba(110,110,110,${.35 + .5 * f})`; c.beginPath(); c.moveTo(x, y - 46); c.lineTo(x, y); c.stroke(); }
  // rows of cells
  for (let row = 0; row < NROW; row++) {
    const y0 = TOP + 40 + row * ROWH;
    c.strokeStyle = 'rgba(110,110,110,.55)'; c.lineWidth = 1.4 * lw; c.beginPath(); c.ellipse(CX, y0 - 3, R, RY, 0, 0, Math.PI); c.stroke();
    for (let k = 0; k < NCOL; k++) {
      const a0 = cellAng(k) + .012, a1 = cellAng(k + 1) - .012, am = (a0 + a1) / 2 + rt, f = facing(am);
      if (f <= .02) continue;
      const q = cellQuad(row, a0, a1, rt);
      const isYou = row === YOU.row && k === KYOU;
      const is404 = row === X404.row && k === K404;
      const al = .25 + .6 * f;
      poly(c, q); c.strokeStyle = `rgba(150,150,150,${al})`; c.lineWidth = 1.5 * lw; c.stroke();
      // bed glyph: two little boxes
      const cx = (q[2][0] + q[7][0]) / 2, cy = (q[2][1] + q[7][1]) / 2, ww = Math.abs(q[4][0] - q[0][0]);
      if (ww > 6) { c.strokeStyle = `rgba(140,140,140,${al * .8})`; c.lineWidth = 1.1 * lw; c.strokeRect(cx - ww * .32, cy - 6, ww * .26, 12); c.strokeRect(cx + ww * .06, cy - 6, ww * .26, 12); }
      if (S.nums > .01 && ww > 10) { c.save(); c.globalAlpha = S.nums * f; c.fillStyle = '#BDBDBD'; c.font = FONT(9); c.textAlign = 'center'; c.fillText(String(row * NCOL + ((k + 7) % NCOL) + 1).padStart(4, '0'), cx, cy - 8); c.restore(); }
      if (isYou && S.you > 0) {
        poly(c, q); c.fillStyle = P.amber; c.globalAlpha = Math.min(1, S.you); c.fill(); c.globalAlpha = 1;
        poly(g, q); g.fillStyle = 'rgba(245,168,42,.9)'; g.fill();
        yourCell = [cx, cy, ww];
      }
      if (is404 && S.red > 0) {
        const pul = .8 + .2 * Math.sin(t * 5);
        poly(c, q); c.fillStyle = `rgba(120,0,0,${S.red})`; c.fill();
        c.save(); c.globalAlpha = S.red; c.font = FONT(15); c.textAlign = 'center'; c.textBaseline = 'middle';
        const bw = ww * .62; c.fillStyle = 'rgba(200,0,0,.85)'; c.fillRect(cx - bw / 2 + 3, cy - 9, bw, 18); c.strokeStyle = '#FF6060'; c.lineWidth = 1.5; c.strokeRect(cx - bw / 2 + 3, cy - 9, bw, 18);
        c.fillStyle = '#FFD7D7'; c.fillText('404', cx + 3, cy + 1); c.restore();
        for (const [r, a] of [[22, .9], [40, .45], [62, .22]]) { c.strokeStyle = `rgba(255,40,40,${a * S.red * pul})`; c.lineWidth = 2; c.beginPath(); c.ellipse(cx, cy, r * 1.25, r, 0, 0, TAU); c.stroke(); }
        glowDot(g, cx, cy, 90, 'rgba(255,30,30,1)', S.red * pul);
      }
    }
  }
}
let yourCell = null;

// ---------- corridor (hand-projected 3D, red) ----------
const F = 700, XW = 1.5, YF = -1.15, YC = 1.35, PITCH = 1.45;
function proj(cam, p) { const dx = p[0] - cam.x, dy = p[1] - cam.y, dz = p[2] - cam.z, ca = Math.cos(cam.yaw), sa = Math.sin(cam.yaw); return [dx * ca - dz * sa, dy, dx * sa + dz * ca]; }
function clipNear(pts, n = .06) { const out = []; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length], ia = a[2] > n, ib = b[2] > n; if (ia) out.push(a); if (ia !== ib) { const u = (n - a[2]) / (b[2] - a[2]); out.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u), n]); } } return out; }
const scr = (q, s = 1) => [(W / 2 + F * q[0] / q[2]) * s, (H / 2 - F * q[1] / q[2]) * s];
const TGT_K = 12;   // the 0404 frame on the right wall
function corCam(t) {
  const zc = TGT_K * PITCH + PITCH / 2;
  const u = eio(seg(t, T.dive1 - .5, T.knock1 - 1.2)), v = ss(seg(t, T.knock1 - 2.2, T.knock1 - .9));
  let sh = 0; for (const [k0, amp] of [[T.knock1, .008], [T.knock2, .025]]) for (let j = 0; j < 3; j++) { const tk = k0 + j * .22; if (t > tk && t < tk + .18) sh += Math.sin((t - tk) * 120) * amp * (1 - (t - tk) / .18); }
  return { x: lerp(0, -.32, v) + sh, y: .12 + sh * .6, z: lerp(-1.5, zc - .66, u) + seg(t, T.knock1, T.back2a) * .2, yaw: lerp(0, 1.22, eio(seg(t, T.knock1 - 2.4, T.knock1 - .8))) };
}
function drawCorridor(t) {
  const c = corX, g = corG; c.setTransform(1, 0, 0, 1, 0, 0); g.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = '#030303'; c.fillRect(0, 0, W, H); g.clearRect(0, 0, W * G, H * G);
  const cam = corCam(t), quads = [], add = (pts, fill, glow) => quads.push({ pts, fill, glow });
  const acc = '255,42,42';
  for (let k = -2; k < 26; k++) {
    const z0 = k * PITCH, z1 = z0 + PITCH;
    add([[-XW, YF, z0], [XW, YF, z0], [XW, YF, z1], [-XW, YF, z1]], k % 2 ? '#0E0E0E' : '#111');
    add([[-XW, YC, z0], [XW, YC, z0], [XW, YC, z1], [-XW, YC, z1]], '#0C0C0C');
    add([[-.55, YC - .01, z0 + .3], [.55, YC - .01, z0 + .3], [.55, YC - .01, z1 - .3], [-.55, YC - .01, z1 - .3]], '#B83030', `rgba(${acc},.9)`);
    add([[-.05, YF + .01, z0 + .2], [.05, YF + .01, z0 + .2], [.05, YF + .01, z0 + .8], [-.05, YF + .01, z0 + .8]], `rgb(${acc})`, `rgba(${acc},.7)`);
    for (const s of [-1, 1]) {
      const xw = s * XW, xr = s * (XW + .22), num = 380 + k * 2 + (s > 0 ? 0 : 1);
      quads.push({ pts: [[xw, YF, z0], [xw, YC, z0], [xw, YC, z1], [xw, YF, z1]], fill: '#151515', back: 1 });
      const a = z0 + .2, b = z1 - .2, y0 = -.75, y1 = .95, i = .14;
      add([[xw, y0, a], [xw, y1, a], [xw, y1, a + i], [xw, y0, a + i]], '#6E6E6E');
      add([[xw, y0, b - i], [xw, y1, b - i], [xw, y1, b], [xw, y0, b]], '#6E6E6E');
      add([[xw, y1 - i, a + i], [xw, y1, a + i], [xw, y1, b - i], [xw, y1 - i, b - i]], '#7C7C7C');
      add([[xw, y0, a + i], [xw, y0 + i, a + i], [xw, y0 + i, b - i], [xw, y0, b - i]], '#5E5E5E');
      add([[xw, y0 + i, a + i], [xw, y1 - i, a + i], [xr, y1 - i, a + i], [xr, y0 + i, a + i]], '#444');
      add([[xw, y0 + i, b - i], [xw, y1 - i, b - i], [xr, y1 - i, b - i], [xr, y0 + i, b - i]], '#383838');
      add([[xw, y1 - i, a + i], [xw, y1 - i, b - i], [xr, y1 - i, b - i], [xr, y1 - i, a + i]], '#2E2E2E');
      add([[xw, y0 + i, a + i], [xw, y0 + i, b - i], [xr, y0 + i, b - i], [xr, y0 + i, a + i]], '#505050');
      const hot = s > 0 && k === TGT_K;
      quads.push({ pts: [[xr, y0 + i, a + i], [xr, y1 - i, a + i], [xr, y1 - i, b - i], [xr, y0 + i, b - i]], fill: '#0B0B0B', tex: hot, side: s, label: { num: hot ? 404 : num, p: [xw, 1.12, (a + b) / 2], hot } });
    }
  }
  const items = [];
  for (const q of quads) { const cp = clipNear(q.pts.map(p => proj(cam, p))); if (cp.length < 3) continue; const zc = cp.reduce((s, p) => s + p[2], 0) / cp.length; items.push({ q, cp, zc: zc + (q.back ? 1e3 : 0) }); }
  items.sort((a, b) => b.zc - a.zc);
  const texts = [];
  for (const { q, cp, zc } of items) {
    const fog = Math.exp(-Math.max(0, (q.back ? zc - 1e3 : zc) - 1) / 7), sp = cp.map(p => scr(p));
    poly(c, sp); c.fillStyle = q.fill; c.fill();
    if (q.glow) { g.globalAlpha = fog; poly(g, cp.map(p => scr(p, G))); g.fillStyle = q.glow; g.fill(); g.globalAlpha = 1; }
    if (q.tex && cp.length === 4) panelTex(c, g, q, cam, t);
    poly(c, sp); c.globalAlpha = 1 - fog; c.fillStyle = '#030303'; c.fill(); c.globalAlpha = 1;
    if (q.label) texts.push({ ...q.label, fog });
  }
  for (const Lb of texts) {
    const p = proj(cam, Lb.p); if (p[2] < .4) continue;
    const [sx, sy] = scr(p), size = F * .17 / p[2]; if (size < 5) continue;
    c.save(); c.globalAlpha = Lb.fog; c.font = FONT(size); c.textAlign = 'center'; c.fillStyle = Lb.hot ? '#FF4040' : '#A8A8A8';
    if (Lb.hot) { c.shadowColor = 'rgba(255,30,30,.9)'; c.shadowBlur = 20; }
    c.fillText(String(Lb.num).padStart(4, '0'), sx, sy); c.restore();
    if (Lb.hot && p[2] < 6) TEXTS.push({ id: 'n404', text: '0404', x0: sx - 80, y0: sy - size, x1: sx + 80, y1: sy, pass: t < T.knock1 - 1 });
  }
