<body><canvas id="c"></canvas>
<script type="module">
import { clamp, lerp, seg, ss, eio, eo, ei, back, mulberry, hash, TAU } from '/core/lib.js';

const W = innerWidth, H = innerHeight;            // 1080 × 1920
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const C = { P: '#efe2c4', K: '#231a14', T: '#1f6f78', M: '#e0a526', R: '#d8432c' };
const DUR = 35.10;
window.DUR = DUR;
const CAPY = Math.round(H * 0.65);                  // caption centre: 1248

// ───────────────────────── narration-locked timeline ─────────────────────────
// times are seconds in the trimmed narration (first word at ≈0.01 s, last word ends ≈35.0 s)
const CAPS = [
  ['Police heard this *bank*', 0.00],
  ['robbery happening *live,*', 0.98],
  ['and still couldn\'t', 2.59],
  ['*stop* it.', 3.28, 3.95],
  ['In *1971,*', 4.58],
  ['a *gang* rented', 6.10],
  ['a *shop* two doors', 6.78],
  ['from a *Lloyds* bank', 7.74],
  ['on *Baker* *Street*', 8.66],
  ['in *London.*', 9.48, 10.30],
  ['They dug a', 10.76],
  ['*40* *ft* tunnel', 11.20],
  ['under the *restaurant*', 12.02],
  ['in between,', 12.86],
  ['straight into the *vault.*', 13.76, 15.10],
  ['A *lookout*', 15.94],
  ['on a *rooftop*', 16.24],
  ['talked to them', 17.04],
  ['by *walkie-talkie.*', 17.70, 18.95],
  ['*Half* *a* *mile* away,', 19.56],
  ['*Robert* *Rowlands*', 20.52],
  ['picked up *every* *word,*', 21.16],
  ['and *taped* it.', 22.55, 23.45],
  ['But the *tapes*', 24.14],
  ['*never* named the bank.', 24.60, 26.25],
  ['Police checked', 26.78],
  ['*750* of them.', 27.42, 29.25],
  ['By the time', 29.70],
  ['they found', 30.14],
  ['the *right* *one,*', 30.60],
  ['*268* safe deposit boxes', 31.70],
  ['had been *emptied.*', 34.12, DUR],
];
CAPS.forEach((c, i) => { c.t0 = c[1]; c.t1 = c[2] ?? CAPS[i + 1][1]; c.words = c[0].split(' ').map(w => ({ s: w.replace(/\*/g, ''), hi: w.includes('*') })); c.text = c.words.map(w => w.s).join(' '); });

// scenes (cut times); W = dot wipe at the cut, X = hard cut
const CUT = { street: 6.25, tunnel: 10.45, wall: 13.65, roof: 15.60, window: 19.30, map: 21.60, eject: 23.30, pins: 26.72, door: 30.45, boxes: 31.60 };
const WIPES = [[CUT.street, C.T], [CUT.tunnel, C.M], [CUT.roof, C.K], [CUT.window, C.M], [CUT.map, C.T], [CUT.eject, C.M], [CUT.pins, C.R], [CUT.boxes, C.K]];
const SHAKES = [[14.92, 24, .5], [26.05, 16, .35], [31.40, 10, .3], [32.00, 14, .35], [13.65, 6, .2]];
const FLASH = [[14.92, .45], [26.05, .3], [32.00, .35]];
const SFX = [  // every effect sits in a measured pause in the narration
  { t: 4.02, type: 'slide' }, { t: 10.18, type: 'whoosh' }, { t: 14.90, type: 'burst' },
  { t: 18.74, type: 'walkie' }, { t: 23.22, type: 'eject' }, { t: 23.70, type: 'slide' },
  { t: 26.02, type: 'stamp' }, { t: 29.03, type: 'taps' }, { t: 29.36, type: 'whoosh' }, { t: 31.39, type: 'clunk' },
];
const GAPS = [[2.28, 2.59], [3.76, 4.58], [10.11, 10.78], [13.58, 13.77], [14.87, 15.96], [18.69, 19.58], [22.34, 22.57], [23.18, 24.16], [25.96, 26.79], [28.99, 29.72], [31.37, 31.70]];
window.EV = [...SFX, ...CAPS.map(c => ({ t: c.t0, type: 'cap', t1: c.t1, text: c.text })), ...GAPS.map(g => ({ t: g[0], type: 'gap', t1: g[1] })), { t: 31.37, type: 'musicstop' }];

// ───────────────────────── helpers ─────────────────────────
let T = 0, BOIL = 0, TX = [];
const jit = (s, a = 2.4) => (hash(s * 13.37 + BOIL * 7.91) - .5) * 2 * a;
const R2 = Math.PI / 180;
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function ink(lw = 7, col = C.K) { ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
function fill(col) { ctx.fillStyle = col; ctx.fill(); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); }
function poly(pts, seed = 0, amp = 0, close = true) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => { const X = x + (amp ? jit(seed + i * 3.1, amp) : 0), Y = y + (amp ? jit(seed + i * 5.7 + 1, amp) : 0); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
  if (close) ctx.closePath();
}
// halftone: rotated dot grid, radius from a density field
function ht(x, y, w, h, step, ang, f, col, k = .68) {
  const a = ang * R2, ca = Math.cos(a), sa = Math.sin(a), cx = x + w / 2, cy = y + h / 2, n = Math.ceil(Math.hypot(w, h) / 2 / step) + 1;
  ctx.beginPath();
  for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) {
    const u = i * step, v = j * step, px = cx + u * ca - v * sa, py = cy + u * sa + v * ca;
    if (px < x - step || px > x + w + step || py < y - step || py > y + h + step) continue;
    const d = f(px, py); if (!(d > 0)) continue;
    const r = Math.min(d, 1.1) * step * k; if (r < .7) continue;
    ctx.moveTo(px + r, py); ctx.arc(px, py, r, 0, TAU);
  }
  ctx.fillStyle = col; ctx.fill();
}
const radial = (cx, cy, r0, r1, d0 = 1, d1 = 0) => (x, y) => { const q = clamp((Math.hypot(x - cx, y - cy) - r0) / (r1 - r0)); return lerp(d0, d1, q); };
const ramp = (y0, y1, d0, d1) => (x, y) => lerp(d0, d1, clamp((y - y0) / (y1 - y0)));
function mul(fn) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; fn(); ctx.restore(); }
function clipTo(pathFn, fn) { ctx.save(); pathFn(); ctx.clip(); fn(); ctx.restore(); }
function camera(s, fx, fy, dx = 0, dy = 0, rot = 0) { ctx.translate(fx + dx, fy + dy); ctx.rotate(rot); ctx.scale(s, s); ctx.translate(-fx, -fy); }
function reg(id, text, x0, y0, x1, y1, pass = false) {
  const m = ctx.getTransform(), p = [[x0, y0], [x1, y0], [x0, y1], [x1, y1]].map(([x, y]) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f]);
  TX.push({ id, text, x0: Math.min(...p.map(q => q[0])), y0: Math.min(...p.map(q => q[1])), x1: Math.max(...p.map(q => q[0])), y1: Math.max(...p.map(q => q[1])), pass });
}
function txt(s, x, y, font, col, align = 'left', shadow = null, off = 8) {
  ctx.font = font; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if (shadow) mul(() => { ctx.fillStyle = shadow; ctx.fillText(s, x + off, y + off); });
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
// per-character pop line, returns width
function popLine(s, x, y, size, family, col, shadow, t0, stagger = .022) {
  ctx.font = `${size}px ${family}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let cx = x;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i], w = ctx.measureText(ch).width, a = seg(T, t0 + i * stagger, t0 + i * stagger + .3);
    if (a > 0 && ch !== ' ') {
      const dy = (1 - back(a, 2.2)) * 70, sq = 1 + .25 * Math.exp(-a * 6) * Math.cos(a * 18);
      ctx.save(); ctx.translate(cx + w / 2, y + dy); ctx.scale(1 / sq, sq * Math.min(1, a * 4));
      if (shadow) mul(() => { ctx.fillStyle = shadow; ctx.fillText(ch, -w / 2 + 7, 7); });
      ctx.fillStyle = col; ctx.fillText(ch, -w / 2, 0); ctx.restore();
    }
    cx += w;
  }
  return cx - x;
}
// rough rubber stamp, pre-rendered
function makeStamp(lines, w, h, seed) {
  const c = document.createElement('canvas'); c.width = w + 40; c.height = h + 40; const g = c.getContext('2d');
  g.translate(20, 20); g.strokeStyle = C.R; g.fillStyle = C.R; g.lineWidth = 14;
  g.beginPath(); g.roundRect(0, 0, w, h, 26); g.stroke(); g.lineWidth = 5; g.beginPath(); g.roundRect(18, 18, w - 36, h - 36, 14); g.stroke();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach(([s, font, y]) => { g.font = font; g.fillText(s, w / 2, y); });
  const rnd = mulberry(seed); g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 1400; i++) { g.globalAlpha = .5 + rnd() * .5; g.beginPath(); g.arc(rnd() * (w + 40) - 20, rnd() * (h + 40) - 20, .6 + rnd() * 2.6, 0, TAU); g.fill(); }
  for (let i = 0; i < 26; i++) { g.globalAlpha = .35; g.lineWidth = 1 + rnd() * 3; g.beginPath(); const x = rnd() * w, y = rnd() * h; g.moveTo(x, y); g.lineTo(x + 40 + rnd() * 120, y + (rnd() - .5) * 20); g.stroke(); }
  return c;
}
function stampDraw(img, x, y, rot, t0) {
  const a = T - t0; if (a < 0) return;
  let s = a < .09 ? lerp(2.6, 1, ei(a / .09)) : 1 + .05 * Math.exp(-(a - .09) * 14) * Math.cos((a - .09) * 40);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.globalAlpha = .93;
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(img, -img.width / 2, -img.height / 2); ctx.restore();
}

// ───────────────────────── paper ─────────────────────────
let PAPER;
function buildPaper() {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  const tile = document.createElement('canvas'); tile.width = 54; tile.height = 96; const tg = tile.getContext('2d'), rnd = mulberry(11);
  const id = tg.createImageData(54, 96);
  for (let i = 0; i < id.data.length; i += 4) { const v = 236 + rnd() * 19; id.data[i] = v; id.data[i + 1] = v - 3; id.data[i + 2] = v - 9; id.data[i + 3] = 255; }
  tg.putImageData(id, 0, 0); g.imageSmoothingEnabled = true; g.globalCompositeOperation = 'multiply'; g.drawImage(tile, 0, 0, W, H);
  const d = g.getImageData(0, 0, W, H), r2 = mulberry(5);
  for (let i = 0; i < d.data.length; i += 4) { const n = (r2() - .5) * 14; d.data[i] += n; d.data[i + 1] += n * .96; d.data[i + 2] += n * .9; }
  g.putImageData(d, 0, 0);
  const vg = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .72); vg.addColorStop(0, '#ffffff'); vg.addColorStop(1, '#d9cdb6');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'multiply'; g.fillStyle = '#ece6da'; g.fillRect(0, H / 2 - 2, W, 3); g.fillStyle = '#f6f2ea'; g.fillRect(0, H / 2 + 1, W, 6);
  PAPER = c;
}
function grain() {
  const rnd = mulberry(1000 + Math.floor(T * 15));
  ctx.fillStyle = C.P; for (let i = 0; i < 260; i++) { ctx.fillRect(rnd() * W, rnd() * H, 1 + rnd() * 2.5, 1 + rnd() * 2.5); }
  ctx.fillStyle = C.K; for (let i = 0; i < 70; i++) { ctx.fillRect(rnd() * W, rnd() * H, 1 + rnd() * 1.6, 1 + rnd() * 1.6); }
}

// ───────────────────────── figures (silhouettes, no faces) ─────────────────────────
function walker(x, y, s, ph, seed) {  // generic figure in coat and flat cap, facing right, feet at y
  ctx.save(); ctx.translate(x + jit(seed, 1.5), y); ctx.scale(s, s);
  const sw = Math.sin(ph), bob = Math.abs(Math.cos(ph)) * 6;
  ctx.fillStyle = C.K;
  for (const k of [-1, 1]) { ctx.save(); ctx.translate(0, -100 - bob); ctx.rotate(k * sw * .45); rr(-11, 0, 22, 104, 10); ctx.fill(); ctx.restore(); }
  poly([[-34, -215 - bob], [30, -215 - bob], [40, -90 - bob], [-42, -90 - bob]], seed, 1.5); fill(C.K);
  ctx.save(); ctx.translate(18, -205 - bob); ctx.rotate(-sw * .5); rr(-10, 0, 20, 95, 10); ctx.fill(); ctx.restore();
  circ(4, -245 - bob, 25); fill(C.K);
  poly([[-26, -258 - bob], [24, -266 - bob], [44, -256 - bob], [-26, -248 - bob]]); fill(C.K);
  ctx.restore();
}

// ───────────────────────── scenes ─────────────────────────
// 1 · the listening room (0 → 6.25)
function sListen() {
  const t = T;
  ctx.fillStyle = C.P; ctx.fillRect(0, 0, W, H);
  ctx.save(); camera(lerp(1, 1.07, ss(t / 6.25)) * (1 + .006 * Math.sin(t * TAU * 1.6)), 560, 900);
  ht(0, 520, W, 900, 22, 15, radial(640, 880, 60, 640, 1, 0), C.M, .7);
  mul(() => ht(0, 520, W, 900, 22, 45, radial(640, 880, 260, 760, .55, 0), C.T, .62));
  // desk
  ctx.fillStyle = C.K; ctx.fillRect(-60, 1080, W + 120, 150); ctx.fillStyle = C.M; ctx.fillRect(-60, 1080, W + 120, 10);
  // reel-to-reel
  ctx.save(); ctx.translate(800, 1080); ctx.scale(.86, .86); ctx.translate(-800, -1080);
  rr(590, 600, 420, 480, 22); fill(C.P); ink(8);
  mul(() => clipTo(() => rr(590, 600, 420, 480, 22), () => ht(590, 600, 420, 480, 20, 30, ramp(600, 1080, .15, .62), C.T, .66)));
  for (const [cx, dir] of [[690, 1], [910, 1]]) {
    const a = t * 3.6 * dir;
    circ(cx, 730, 92); fill(C.K); circ(cx, 730, 82); fill(C.P); ink(5);
    ctx.save(); ctx.translate(cx, 730); ctx.rotate(a);
    for (let k = 0; k < 3; k++) { ctx.rotate(TAU / 3); ctx.beginPath(); ctx.moveTo(14, -10); ctx.arc(0, 0, 60, -.45, .45); ctx.lineTo(14, 10); ctx.closePath(); fill(C.K); }
    circ(0, 0, 13); fill(C.M); ink(4); ctx.restore();
  }
  ctx.beginPath(); ctx.moveTo(620, 760); ctx.lineTo(650, 860); ctx.lineTo(950, 860); ctx.lineTo(990, 760); ink(4);
  rr(735, 845, 130, 34, 8); fill(C.K);
  // VU meter
  rr(625, 905, 170, 100, 10); fill(C.P); ink(5);
  ctx.beginPath(); ctx.arc(710, 1000, 70, -2.5, -.64); ink(3);
  const lvl = .5 + .35 * Math.sin(t * 17) * Math.sin(t * 5.3) + .1 * Math.sin(t * 41);
  ctx.save(); ctx.translate(710, 1000); ctx.rotate(lerp(-1.0, 1.0, lvl)); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -82); ink(4, C.R); ctx.restore();
  // speaker + pulsing dot rings
  circ(915, 960, 62); fill(C.K); ht(853, 898, 124, 124, 13, 0, (x, y) => Math.hypot(x - 915, y - 960) < 54 ? .7 : 0, C.M, .6);
  for (let k = 0; k < 4; k++) {
    const p = ((t * .9 + k / 4) % 1), r = 80 + p * 520, n = Math.floor(r / 14), dr = (1 - p) * 9 + 1.5;
    ctx.beginPath();
    for (let i = 0; i < n; i++) { const a = Math.PI * .55 + (i / n) * Math.PI * 1.1; const px = 915 + Math.cos(a) * r, py = 960 + Math.sin(a) * r * .9; if (py > 1075) continue; ctx.moveTo(px + dr, py); ctx.arc(px, py, dr, 0, TAU); }
    fill(C.T);
  }
  ctx.restore();
  // the officer: seated, leaning toward the machine
  const lean = ss(t / 3) * 18 + Math.sin(t * 2.1) * 6, rot = -.05 - ss(t / 3) * .05 + Math.sin(t * 1.7) * .015;
  ctx.save(); ctx.translate(290 + lean, 1080); ctx.scale(.84, .84); ctx.rotate(rot);
  ctx.fillStyle = C.K;
  poly([[-170, 0], [-150, -250], [-90, -330], [30, -350], [110, -300], [150, -180], [120, 0]], 3, 2.2); ctx.fill();
  ctx.save(); ctx.translate(70, -310); ctx.rotate(-.75 + Math.sin(t * 2.3) * .05); rr(-26, -10, 52, 210, 24); ctx.fill(); ctx.translate(0, 190); ctx.rotate(-.9); rr(-22, -8, 44, 150, 20); ctx.fill(); circ(0, 150, 28); ctx.fill(); ctx.restore();
  rr(0, -400, 60, 70, 20); ctx.fill();
  const hx = 70 + jit(9, 1.4), hy = -470;
  circ(hx, hy, 78); ctx.fill();
  poly([[hx - 66, hy - 52], [hx - 104, hy - 112], [hx + 96, hy - 134], [hx + 74, hy - 56]], 5, 1.6); ctx.fill();
  poly([[hx + 40, hy - 60], [hx + 150, hy - 44], [hx + 140, hy - 30], [hx + 30, hy - 42]]); ctx.fill();
  poly([[hx - 70, hy - 66], [hx + 76, hy - 70], [hx + 76, hy - 58], [hx - 68, hy - 54]]); fill(C.M);
  ctx.beginPath(); ctx.arc(hx - 30, hy - 10, 92, Math.PI * 1.0, Math.PI * 1.62); ink(16, C.K); ink(4, C.M);
  ell(hx - 62, hy + 2, 30, 44); fill(C.K); ctx.beginPath(); ctx.ellipse(hx - 62, hy + 2, 30, 44, 0, Math.PI * .6, Math.PI * 1.4); ink(5, C.M);
  ctx.beginPath(); ctx.moveTo(hx - 70, hy + 40); ctx.bezierCurveTo(hx - 130, hy + 200, 200, 120, 330, 40); ink(5, C.K);
  ctx.beginPath(); ctx.moveTo(hx + 76, hy - 20); ctx.quadraticCurveTo(hx + 96, hy + 20, hx + 70, hy + 70); ink(5, C.M);
  ctx.restore();
  ctx.restore();
  // hook headline (top), held until 5.35
  const out = ei(seg(t, 5.35, 5.65)) * -700;
  ctx.save(); ctx.translate(0, out);
  const L = [['Police heard the', C.K, C.T, -.55], ['robbery happening.', C.K, C.T, -.45], ['They couldn\'t', C.R, C.K, -.25], ['find it.', C.R, C.K, -.15]];
  ctx.font = '100px Slab'; const size = Math.min(92, Math.floor(100 * 950 / Math.max(...L.map(l => ctx.measureText(l[0]).width)))); let y = 180;
  L.forEach(([s, col, sh, t0], i) => { popLine(s, 64, y, size, 'Slab', col, sh, t0, .018); y += i === 1 ? size * 1.36 : size * 1.13; });
  if (t < 5.36) reg('hook', 'Police heard the robbery happening. They couldn\'t find it.', 64, 120, 1020, 610);
  ctx.restore();
}
// dossier card, enters over the listening room, then pinned above the street
function dossierCard() {
  const t = T; if (t < 4.0 || t >= CUT.tunnel) return;
  const a = back(seg(t, 4.0, 4.42), 1.6), b = eio(seg(t, 5.95, 6.45));
  const y = lerp(2500, 1010, a), x = 540;
  const cx = lerp(x, 540, b), cy = lerp(y, 345, b), s = lerp(1, .74, b), rot = lerp(-3.5, 2.5, b) * R2 + Math.sin(t * 1.3) * .004;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(s, s);
  rr(-420, -250, 120, 40, 12); fill(C.M); ink(6);
  mul(() => { rr(-430 + 12, -220 + 12, 860, 440, 18); fill(C.T); });
  rr(-430, -220, 860, 440, 18); fill(C.P); ink(7);
  mul(() => clipTo(() => rr(-430, -220, 860, 440, 18), () => ht(-430, -220, 860, 440, 20, 30, (px, py) => clamp((Math.abs(px) - 330) / 120) * .5 + clamp((Math.abs(py) - 140) / 100) * .4, C.M, .62)));
  txt('CASE 71/0911', -390, -170, '800 30px Mono', C.T);
  ctx.beginPath(); ctx.moveTo(-390, -150); ctx.lineTo(390, -150); ink(3);
  txt('SEPTEMBER 1971', -390, -70, '800 62px Mono', C.K);
  txt('BAKER STREET,', -390, 40, '86px Slab', C.K, 'left', C.T, 6);
  txt('LONDON', -390, 150, '86px Slab', C.K, 'left', C.T, 6);
  // paper clip
  ctx.beginPath(); ctx.roundRect(300, -260, 46, 150, 23); ink(7, C.K); ctx.beginPath(); ctx.roundRect(312, -238, 22, 100, 11); ink(5, C.K);
  if (a >= .999 || t > 4.6) reg('card', 'SEPTEMBER 1971 BAKER STREET, LONDON', -400, -120, 400, 170);
  ctx.restore();
}
// 2 · the street (6.25 → 10.45)
function shopfront(x, w, kind) {
  const top = 840, bot = 1185;
  // upper floors: brick (mustard dots), sash windows
  ctx.fillStyle = C.P; ctx.fillRect(x, 380, w, top - 380);
  ht(x, 380, w, top - 380, 20, 20, (px, py) => .42 + .18 * Math.sin(py * .21), C.M, .64);
  mul(() => ht(x, 380, w, top - 380, 22, 70, ramp(380, 840, .5, .05), C.T, .6));
  ctx.beginPath(); ctx.rect(x, 380, w, top - 380); ink(6);

// city map (shared by 7 and 9/10)
const RIVER = x => 1240 + Math.sin(x * .006 + .6) * 70 + Math.sin(x * .017) * 22;
const MAP = (() => {
  const rnd = mulberry(21), roads = [], minor = [];

function drawMap(night) {

// 7 · waves across the map (21.60 → 23.30)

  for (let k = 0; k < 5; k++) { const q = (lt * 1.1 + k / 5) % 1; ctx.beginPath(); ctx.arc(ROOF[0], ROOF[1], 30 + q * dist, ang - .38, ang + .38); ctx.lineWidth = 12 * (1 - q) + 3; ctx.strokeStyle = C.M; ctx.stroke(); }

// 8 · eject → LOCATION: UNKNOWN (23.30 → 26.72)
const STAMP_Q = { img: null }, STAMP_268 = { img: null };
function sEject() {
  const t = T, lt = t - CUT.eject;
  ctx.fillStyle = C.P; ctx.fillRect(0, 0, W, H);

// 9/10 · pins fill the map, the right one pulses (26.72 → 30.45)
const PINS = (() => {
  const rnd = mulberry(99), out = [];
  while (out.length < 190) { const x = 70 + rnd() * 940, y = 560 + rnd() * 960; if (Math.abs(y - RIVER(x)) < 70) continue; if (Math.hypot(x - 430, y - 720) < 60) continue; out.push([x, y]); }
  out.splice(150, 0, [430, 720]); return out;
})();
const RIGHT = 150;
const COUNT = t => Math.round(750 * Math.pow(seg(t, 26.85, 28.75), 1.7));
function sPins() {
  const t = T, lt = t - CUT.pins;

// 10b · the vault door swings open (30.45 → 31.60)

// 11 · the empty wall (31.60 → end)
function sBoxes() {

// ───────────────────────── overlays ─────────────────────────
function captions() {
  const c = CAPS.find(c => T >= c.t0 && T < c.t1); if (!c) return;
  let size = 68; ctx.font = `${size}px Cap`;
  const sp = ctx.measureText(' ').width; let tw = c.words.reduce((a, w) => a + ctx.measureText(w.s).width, 0) + sp * (c.words.length - 1);

function hud(dark) {

  rr(40, 50, 300, 56, 28); fill(fg); txt('CASE 71/0911', 190, 89, '800 28px Mono', bg, 'center');

function wipe() {

// ───────────────────────── render ─────────────────────────
function scene() {
  const t = T;
  if (t < CUT.street) return [sListen, false];
  if (t < CUT.tunnel) return [sStreet, false];
  if (t < CUT.wall) return [sTunnel, false];

  if (t < CUT.window) return [sRoof, true];

window.TEXTS = (t) => { window.render(t); return TX; };

(async () => {
