<!doctype html>
<html><head><meta charset="utf-8">

</head><body><canvas id="c"></canvas>
<script type="module">
import { clamp, lerp, seg, ss, eio, eo, ei, back, mulberry, hash, vnoise, TAU } from '/core/lib.js';

const W = innerWidth, H = innerHeight;            // 1080 × 1920
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
const G = 0.25;                                     // glow layer scale
const [cutC, cutX] = mk(W, H), [cutGC, cutG] = mk(W * G, H * G);
const [corC, corX] = mk(W, H), [corGC, corG] = mk(W * G, H * G);
const [tmpC, tmpX] = mk(W * G, H * G);

const TL = await (await fetch('timeline.json')).json();
window.DUR = TL.DUR;
const L = Object.fromEntries(TL.lines.map(l => [l.id, l]));
const wt = (id, word) => { const w = L[id].w.find(x => x[0].toLowerCase().startsWith(word.toLowerCase())); return w ? w[1] : L[id].t; };
const lineEnd = id => L[id].t + L[id].d;

const CYL = new URLSearchParams(location.search).get('shape') !== 'box', COVER = new URLSearchParams(location.search).has('cover');
// ---------- palette ----------
const P = {
  sky0: '#140E0A', sky1: '#5A3417', shell: '#A9A48C', shellS: '#6C6855', inner: '#1C2016', cell: '#2E3625', slab: '#12140D',
  amber: '#F2C230', cyan: '#A6FF4D', gold: '#FFC23A', gold2: '#FF8A00', red: '#FF3B3B', mist: '#A8A58E', plate: 'rgba(18,17,11,.9)'
};

// ---------- key times ----------
const T = {
  pullEnd: 1.45, pulse: 1.75, tease: L.l02.w[L.l02.w.length - 1][2] + .3, sweep0: wt('l02', 'and') - .2, sweep1: wt('l02', 'and') + 2.4, w1: L.l03.t - .25, w2: L.l03.t + 2.2, doorPing: wt('l03', 'blast'), counterIn: wt('l03', 'until'),
  dive0: L.l04.t, dive1: L.l04.t + 1.0, you: wt('l05', 'You'), name: wt('l06', 'name'), handle: wt('l06', 'gets'), back0: L.l06.t + L.l06.d - .15, back1: L.l06.t + L.l06.d + .9, m0: L.l06.t + L.l06.d + 1.2, m1: L.l10.t - .1,
  k1: wt('l08', '1,000'), lights: wt('l08', 'on'), k10: wt('l09', '10,000'), air: wt('l09', 'flowing'),
  k100: wt('l10', '100,000'), seal: wt('l10', 'seals'), world: wt('l10', 'wait'), cut: L.l11.t - .75, red: L.l11.t - .1,
  b8show: wt('l12b', 'eighth') - .05, levels: wt('l12', 'seven'), six: wt('l12c', '0.'), dive2a: wt('l12c', '0.') + .15, dive2b: wt('l12c', '0.') + 1.25,
  lock: wt('l12d', 'locked'), arrive: wt('l12d', 'locked') - .1, back2a: L.l12e.t + L.l12e.d - .05, back2b: L.l12e.t + L.l12e.d + 1.0, weld: wt('l12e', 'welded'),
  card: L.l13.t - .05, pantry: wt('l13b', 'garden'), gens: wt('l13c', 'armory'), beside: wt('l13d', 'B7'),
  g0: L.l13b.t - .3, a0: L.l13c.t - .3, d0: L.l13d.t - .2,
  follow: wt('l14', 'Follow'), closes: wt('l14', 'before'), wake: wt('l14', 'wakes'), push0: L.l14.t + L.l14.d - .35, end: TL.DUR
};

// ---------- world geometry (cutaway) ----------
const VX0 = 200, VX1 = 880, VTOP = 600, VBOT = 1490, SURF = 300;
function vaultPath(c, ins) {
  // a buried reinforced-concrete box: flat roof slab, chamfered corners
  const x0 = VX0 + ins, x1 = VX1 - ins, top = VTOP + ins, b = VBOT - ins, ch = Math.max(8, 56 - ins * .6), cb = Math.max(6, 22 - ins * .4);
  c.beginPath(); c.moveTo(x0, b - cb); c.lineTo(x0, top + ch); c.lineTo(x0 + ch, top); c.lineTo(x1 - ch, top); c.lineTo(x1, top + ch);
  c.lineTo(x1, b - cb); c.lineTo(x1 - cb, b); c.lineTo(x0 + cb, b); c.closePath();
}
const CW = 15, CH = 11, GX0 = VX0 + 40, GY0 = VTOP + 40;      // cell pitch and grid origin
const cellXY = (i, j) => [GX0 + i * CW, GY0 + j * CH];
const NCOL = Math.floor((VX1 - VX0 - 76) / CW), NROW = Math.floor((VBOT - GY0 - 34) / CH);
const SPINE = Math.floor(NCOL / 2);
const DOOR = { x: VX0 + 2, y: 900, r: 64 }, TUN = { x: -180, y: SURF - 10 };
const tunU = (() => { const dx = TUN.x - DOOR.x, dy = TUN.y - DOOR.y, l = Math.hypot(dx, dy); return [dx / l, dy / l]; })();
const CY = { cx: 540, R: 345, r: 312, ry: 30, top: 620, bot: 1460, NL: 7, NA: 30, ROWS: 7 };
CY.LH = (CY.bot - CY.top) / CY.NL;
// a cylinder cell is [level, row, column]: on the back wall of a level, rising from its floor
function cylCellRect(lv, row, a) {
  const a0 = -1.42 + a * 2.84 / CY.NA, a1 = a0 + 2.84 / CY.NA - .012, am = (a0 + a1) / 2, yF = CY.top + (lv + 1) * CY.LH + (lv >= 7 ? 95 : 0);
  const x0 = CY.cx + CY.r * Math.sin(a0), x1 = CY.cx + CY.r * Math.sin(a1), yb = yF - CY.ry * Math.cos(am) - 6 - row * 12.5;
  return [x0, yb - 9.5, x1 - x0, 9.5];
}
const cellRect = cell => cell.length === 3 ? cylCellRect(...cell) : (([x, y]) => [x, y, 11, 7])(cellXY(cell[0], cell[1]));
const LOOPC = CYL ? [3, 1, 6] : [8, 39], DIVE1 = CYL ? [4, 1, 18] : [27, 46], DIVE2 = CYL ? [7, 2, 21] : [SPINE + 1, 10], YOURBED = CYL ? [4, 1, 18] : [8, 63], SIXC = CYL ? [7, 2, 21] : [SPINE, 3];
const ABOVE000 = [6, 0, 21];
const cellCenter = cell => { const [x, y, w, h] = cellRect(cell); return [x + w / 2, y + h / 2]; };
const rnd = mulberry(7); const LIT = Array.from({ length: NCOL * NROW }, () => rnd());

// ---------- static backgrounds (world, scale .5) ----------
const BG = { x0: -1300, y0: -1500, w: 3700, h: 4600, s: 0.5 };
const [bgC, bgX] = mk(BG.w * BG.s, BG.h * BG.s);
(function buildBG() {
  const c = bgX, r = mulberry(11); c.scale(BG.s, BG.s); c.translate(-BG.x0, -BG.y0);
  let g = c.createLinearGradient(0, BG.y0, 0, SURF); g.addColorStop(0, P.sky0); g.addColorStop(1, P.sky1);
  c.fillStyle = g; c.fillRect(BG.x0, BG.y0, BG.w, SURF - BG.y0);
  c.filter = 'blur(60px)';
  for (let i = 0; i < 40; i++) { c.fillStyle = `rgba(${120 + r() * 70},${60 + r() * 40},${25 + r() * 20},${.16 + r() * .22})`; c.beginPath(); c.ellipse(BG.x0 + r() * BG.w, BG.y0 + r() * (SURF - BG.y0), 120 + r() * 260, 60 + r() * 140, 0, 0, TAU); c.fill(); }
  c.filter = 'none';
  for (let i = 0; i < 260; i++) { const y = BG.y0 + r() * (SURF - BG.y0 - 20); c.fillStyle = ['#7A6E60', '#9A8A70', '#5E554A'][i % 3]; c.globalAlpha = .2 + r() * .35; c.beginPath(); c.arc(BG.x0 + r() * BG.w, y, .8 + r() * 1.8, 0, TAU); c.fill(); }
  c.globalAlpha = 1;
  // earth strata
  g = c.createLinearGradient(0, SURF, 0, BG.y0 + BG.h); g.addColorStop(0, '#2C2A1C'); g.addColorStop(.25, '#212015'); g.addColorStop(1, '#0E0E09');
  c.fillStyle = g; c.fillRect(BG.x0, SURF, BG.w, BG.h);
  const bands = ['#28261A', '#232217', '#1E1D14', '#1A1911', '#16160F', '#13120C'];
  for (let k = 0; k < bands.length; k++) {
    const y = SURF + 90 + k * 260; c.fillStyle = bands[k]; c.beginPath(); c.moveTo(BG.x0, BG.y0 + BG.h);
    for (let x = BG.x0; x <= BG.x0 + BG.w; x += 40) c.lineTo(x, y + Math.sin(x * .004 + k) * 30 + vnoise(x * .01 + k * 9) * 40);
    c.lineTo(BG.x0 + BG.w, BG.y0 + BG.h); c.fill();
  }
  c.filter = 'blur(40px)';
  for (let i = 0; i < 70; i++) { c.fillStyle = `rgba(${80 + r() * 40},${70 + r() * 30},${40 + r() * 20},${.12 + r() * .15})`; c.beginPath(); c.ellipse(BG.x0 + r() * BG.w, SURF + 120 + r() * 3000, 100 + r() * 220, 40 + r() * 90, 0, 0, TAU); c.fill(); }
  c.filter = 'none';
  for (let i = 0; i < 260; i++) {                  // rocks: flat, one shade step
    const x = BG.x0 + r() * BG.w, y = SURF + 60 + r() * 3200, rx = 6 + r() * 26, ry = rx * (.5 + r() * .3);
    c.fillStyle = '#0D0D08'; c.beginPath(); c.ellipse(x, y, rx, ry, r(), 0, TAU); c.fill();
    c.fillStyle = '#3C3A2B'; c.beginPath(); c.ellipse(x - rx * .15, y - ry * .2, rx * .8, ry * .7, r(), 0, TAU); c.fill();
  }
  // surface band
  c.fillStyle = '#3A3122'; c.fillRect(BG.x0, SURF - 6, BG.w, 24); c.fillStyle = '#6E5A3A'; c.fillRect(BG.x0, SURF - 8, BG.w, 4);
  // ruins on the surface: broken flat silhouettes
  for (let i = 0; i < 26; i++) { const x = BG.x0 + 200 + r() * (BG.w - 400), w = 30 + r() * 90, h = 30 + r() * 140; c.fillStyle = '#1C140D'; c.beginPath(); c.moveTo(x, SURF - 6); c.lineTo(x, SURF - h); c.lineTo(x + w * .4, SURF - h + 20 * r()); c.lineTo(x + w * .7, SURF - h * (.5 + .4 * r())); c.lineTo(x + w, SURF - h * .6); c.lineTo(x + w, SURF - 6); c.fill(); }
})();

// ---------- camera ----------
const LCX = cellCenter(LOOPC);
const WIDE = { x: 540, y: 1060, z: 0.86, r: 0 };
function logz(a, b, u) { return Math.exp(lerp(Math.log(a), Math.log(b), u)); }
function mixCam(a, b, u, uz = u) { return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: logz(a.z, b.z, uz), r: lerp(a.r, b.r, u) }; }
const ECU = { x: LCX[0], y: LCX[1], z: 9, r: 0 };
const D1 = { ...(() => { const c = cellCenter(DIVE1); return { x: c[0], y: c[1] }; })(), z: 290, r: 0 };
const D2 = { ...(() => { const c = cellCenter(DIVE2); return { x: c[0], y: c[1] }; })(), z: 290, r: 0 };
const breathe = t => ({ dr: Math.sin(t * .45) * .012, dy: Math.sin(t * .7) * 6 });
function camAt(t) {
  const b = breathe(t);
  const wide = (r) => ({ x: WIDE.x, y: WIDE.y + b.dy, z: WIDE.z, r: r + b.dr });
  if (t < T.pullEnd) { const u = eio(seg(t, .08, T.pullEnd)); return mixCam(ECU, wide(-.035), u, u); }
  if (t < T.w1) return wide(lerp(-.035, .03, ss(seg(t, 3.3, T.w1))));
  if (t < T.dive0) { const u = eio(seg(t, T.w1, T.w2)); return mixCam(wide(.03), { x: 470, y: 930, z: 1.12, r: .01 }, u); }
  if (t < T.back0) { const u = ei(seg(t, T.dive0, T.dive1 + .05)); return mixCam({ x: 470, y: 930, z: 1.12, r: .01 }, D1, ss(seg(t, T.dive0, T.dive0 + .6)), u); }
  if (t < T.m0) { const u = eo(seg(t, T.back0, T.back1 + .4)); return mixCam(D1, wide(0), ss(seg(t, T.back0 + .3, T.back1 + .4)), u); }
  if (t < T.m1) return wide(lerp(0, -.045, ss(seg(t, T.m0, T.m1))));
  if (t < T.seal + .8) { const u = eio(seg(t, T.m1, T.m1 + 1.7)); return mixCam(wide(-.045), { x: 430, y: 930, z: 1.22, r: -.02 }, u); }
  if (t < T.cut) { const u = eio(seg(t, T.seal + .8, T.cut - .1)); return mixCam({ x: 430, y: 930, z: 1.22, r: -.02 }, { x: 540, y: 520, z: .55, r: 0 }, u); }
  const UPV = { x: 540, y: 520, z: .55, r: 0 }, B8V = { x: 540, y: 1520, z: 1.25, r: 0 };
  if (t < T.red) return UPV;
  if (t < T.b8show) return mixCam(UPV, B8V, eio(seg(t, T.red + .4, T.b8show - .2)));
  if (t < T.dive2a) return { ...B8V, y: B8V.y + (t - T.b8show) * 30, z: B8V.z * (1 + (t - T.b8show) * .06) };
  if (t < T.back2a) { const S0 = { ...B8V, y: B8V.y + (T.dive2a - T.b8show) * 30, z: B8V.z * (1 + (T.dive2a - T.b8show) * .06) }; const u = ei(seg(t, T.dive2a, T.dive2b + .05)); return mixCam(S0, D2, ss(seg(t, T.dive2a, T.dive2a + .7)), u); }
  if (t < T.back2b + .6) { const u = eo(seg(t, T.back2a, T.back2b + .4)); return mixCam(D2, wide(.0), ss(seg(t, T.back2a + .3, T.back2b + .4)), u); }
  if (t < T.push0) {
    const base = wide(lerp(0, .03, ss(seg(t, T.back2b + .6, T.push0 - .05))));
    const GC = { x: 470, y: CY.top + 2.62 * CY.LH, z: 4.6, r: 0 }, AC = { x: 470, y: CY.top + 5.62 * CY.LH, z: 4.6, r: 0 };
    const drift = (C, t0) => ({ ...C, x: C.x + (t - t0) * 36, z: C.z * (1 + (t - t0) * .025) });
    if (t < T.g0) return base;
    if (t < T.a0) return mixCam(base, drift(GC, T.g0), eio(seg(t, T.g0, T.g0 + .55)));
    if (t < T.d0) return mixCam(drift(GC, T.g0), drift(AC, T.a0), eio(seg(t, T.a0, T.a0 + .5)));
    return mixCam(drift(AC, T.a0), base, eio(seg(t, T.d0, T.d0 + .6)));
  }
  const u = eio(seg(t, T.push0, T.end)); return mixCam(wide(.03), ECU, u, u);
}
// world → screen for the cutaway
function applyCam(c, cam, s = 1) { c.setTransform(s, 0, 0, s, 0, 0); c.translate(W / 2, H / 2); c.rotate(cam.r); c.scale(cam.z, cam.z); c.translate(-cam.x, -cam.y); }
function w2s(cam, x, y) { const dx = (x - cam.x) * cam.z, dy = (y - cam.y) * cam.z, c = Math.cos(cam.r), s = Math.sin(cam.r); return [W / 2 + dx * c - dy * s, H / 2 + dx * s + dy * c]; }

// ---------- state over time ----------
function state(t) {
  const reset = t > T.red;                      // after the twist, the promise is replayed from zero
  const S = {};
  S.lights = reset ? 0 : ss(seg(t, T.lights - .1, T.lights + .9));
  S.air = reset ? 0 : ss(seg(t, T.air - .2, T.air + .6));
  S.door = reset ? 0 : eio(seg(t, T.seal - .35, T.seal + .55));
  if (t > T.closes) S.door = eio(seg(t, T.closes, T.end + 2.5)) * .55;
  S.world = reset ? 0 : ss(seg(t, T.world - .3, T.world + 1.2));
  S.power = t > T.tease - .05 && t < T.tease + .75 ? (Math.sin((t - T.tease) * 38) > 0 ? .3 : .55) : t < T.cut ? 1 : t < T.red ? .05 + (t > 28.7 && t < 28.76 ? .4 : 0) : 1;
  const pulse = t > T.pulse && t < T.pulse + .9 ? Math.sin(seg(t, T.pulse, T.pulse + .9) * Math.PI) * .55 : 0;
  const tease2 = t > T.seal + .45 && t < T.seal + .95 ? (Math.sin((t - T.seal) * 34) > 0 ? .85 : .15) : 0;
  const tease = t > T.tease && t < T.tease + .75 ? (Math.sin((t - T.tease) * 38) > -.3 ? 1 : .2) : 0;
  S.b8 = t < T.b8show ? Math.max(pulse, tease, tease2) : (t < T.b8show + .45 ? (Math.sin((t - T.b8show) * 40) > -.2 ? 1 : .15) : 1) * (1 + 1.4 * ss(seg(t, T.wake - .3, T.wake + .9)));
  S.lv = t;
  S.redTint = t < T.red ? 0 : t < T.back2a ? ss(seg(t, T.red, T.red + .35)) : 1 - ss(seg(t, T.back2a + .2, T.back2b));
  S.sweep = seg(t, T.sweep0, T.sweep1);
  S.six = t > T.six - .1 ? ss(seg(t, T.six - .1, T.six + .3)) * (1 - ss(seg(t, T.push0 + .6, T.end - .3))) : 0;
  S.pantry = ss(seg(t, T.g0, T.g0 + .45)) * (1 - ss(seg(t, T.follow - .4, T.follow + .3)));
  S.gens = ss(seg(t, T.a0, T.a0 + .45)) * (1 - ss(seg(t, T.follow - .4, T.follow + .3)));
  S.sixTag = ss(seg(t, T.beside - .05, T.beside + .35)) * (1 - ss(seg(t, T.push0, T.push0 + .6)));
  S.yours = seg(t, T.follow - .05, T.follow + .5) * (1 - ss(seg(t, T.push0 + .4, T.end - .4)));
  S.doorPing = t > T.doorPing && t < T.doorPing + 1.6 ? 1 - seg(t, T.doorPing, T.doorPing + 1.6) : 0;
  return S;
}
function counterAt(t) {
  const fmt = n => Math.round(n).toLocaleString('en-US');
  let show = (t > T.counterIn ? back(seg(t, T.counterIn, T.counterIn + .45)) : 0);
  if (t > T.cut) show = 0;
  if (t > T.back2b - .3) show = back(seg(t, T.back2b - .3, T.back2b + .15)) * (1 - ss(seg(t, T.push0 + .3, T.push0 + 1)));
  if (t > T.g0) show *= 1 - ss(seg(t, T.g0, T.g0 + .3));
  if (t < T.k1 || t > T.cut) return { show, tag: 'SURVIVORS INSIDE', txt: '0 / 100,000', pop: 0, roll: false };
  let v, roll = false, pop = 0;
  const r1 = [T.k1 - .1, T.k1 + .55], r2 = [T.k10 - .1, T.k10 + .55], r3 = [T.k100 - .1, T.k100 + .9];
  if (t < r2[0]) { v = 1000 * eo(seg(t, ...r1)); roll = t < r1[1]; pop = seg(t, r1[1], r1[1] + .3); }
  else if (t < r3[0]) { v = lerp(1000, 10000, eo(seg(t, ...r2))); roll = t < r2[1]; pop = seg(t, r2[1], r2[1] + .3); }
  else { v = lerp(10000, 100000, eo(seg(t, ...r3))); roll = t < r3[1]; pop = seg(t, r3[1], r3[1] + .3); }
  return { show, tag: 'GOAL: SURVIVORS', txt: fmt(v), pop: pop > 0 && pop < 1 ? Math.sin(pop * Math.PI) : 0, roll };
}

// ---------- drawing helpers ----------
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function glowDot(c, x, y, r, col, a = 1) { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); c.globalAlpha = a; c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); c.globalAlpha = 1; }
const TEXTS = [];
function tag(c, x, y, text, col, a = 1, size = 20, plate = true, id) {
  if (a <= 0.01) return;
  c.save(); c.globalAlpha = a; c.font = `600 ${size}px Fredoka`; c.letterSpacing = '2px';
  const w = c.measureText(text).width + size * 1.1, h = size * 1.6;
  if (plate) { rr(c, x - w / 2, y - h / 2, w, h, h * .32); c.fillStyle = P.plate; c.fill(); c.lineWidth = 2; c.strokeStyle = col; c.globalAlpha = a * .7; c.stroke(); c.globalAlpha = a; }
  c.fillStyle = col; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, x, y + 1); c.restore();
  return [w, h];
}

// ---------- cylindrical variant (?shape=cyl): a vertical silo cut open at the front ----------
function drawCyl(c, g, t, cam, S) {
  const { cx, R, r, ry, top, bot, NL, LH, NA, ROWS } = CY;
  const fy = k => top + k * LH;
  // outer shell: concrete cylinder (walls, roof cap, base)
  c.fillStyle = P.shellS; c.beginPath(); c.ellipse(cx, top, R, ry + 8, 0, Math.PI, 0); c.lineTo(cx + R, bot); c.ellipse(cx, bot, R, ry + 8, 0, 0, Math.PI); c.closePath(); c.fill();
  c.fillStyle = P.shell; c.beginPath(); c.ellipse(cx, top, R, ry + 8, 0, 0, TAU); c.fill();                 // roof cap top
  c.save(); c.beginPath(); c.ellipse(cx, top, R, ry + 8, 0, 0, TAU); c.clip(); c.strokeStyle = 'rgba(70,64,48,.4)'; c.lineWidth = 2; for (let k = 1; k < 5; k++) { c.beginPath(); c.ellipse(cx, top, R * k / 5, (ry + 8) * k / 5, 0, 0, TAU); c.stroke(); } c.restore();
  // interior back wall with curvature shading
  const gr = c.createLinearGradient(cx - r, 0, cx + r, 0); gr.addColorStop(0, '#0E110B'); gr.addColorStop(.5, '#232A1B'); gr.addColorStop(1, '#0E110B');
  c.fillStyle = gr; c.fillRect(cx - r, top + ry + 8, 2 * r, bot - top - ry - 8);
  // levels: back-wall bunks, floor disc, core, then the ceiling's front lip over them
  for (let k = 0; k < NL; k++) {
