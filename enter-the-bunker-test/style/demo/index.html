<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/core/fonts/fonts.css">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script type="module">
import { clamp, lerp, seg, ss, eio, eo, ei, back, mulberry, hash, vnoise, TAU } from '/core/lib.js';

const W = innerWidth, H = innerHeight;            // 1080 × 1920
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
const G = 0.25;                                     // glow layer scale
const [cutC, cutX] = mk(W, H), [cutGC, cutG] = mk(W * G, H * G);
const [corC, corX] = mk(W, H), [corGC, corG] = mk(W * G, H * G);
const [tmpC, tmpX] = mk(W * G, H * G);

const TL = await (await fetch('timeline.json')).json();
window.DUR = TL.DUR;
const L = Object.fromEntries(TL.lines.map(l => [l.id, l]));
const wt = (id, word) => { const w = L[id].w.find(x => x[0].toLowerCase().startsWith(word.toLowerCase())); return w ? w[1] : L[id].t; };
const lineEnd = id => L[id].t + L[id].d;

// ---------- palette ----------
const P = {
  sky0: '#081130', sky1: '#1B2A66', shell: '#DCE3EE', shellS: '#9AA6BC', inner: '#1A2647', cell: '#27365F', slab: '#121B36',
  amber: '#FFB52E', cyan: '#7FE3FF', gold: '#FFC23A', gold2: '#FF8A00', red: '#FF3B3B', mist: '#9AA0B8', plate: 'rgba(12,18,38,.88)'
};

// ---------- key times ----------
const T = {
  pullEnd: 3.3, sweep0: 4.2, sweep1: 6.8, doorPing: wt('l03', 'blast'), counterIn: wt('l03', 'until'),
  dive0: 10.0, dive1: 11.0, you: wt('l05', 'You'), name: wt('l06', 'name'), handle: wt('l06', 'with'), back0: 16.35, back1: 17.4,
  k1: wt('l08', '1,000'), lights: wt('l08', 'on'), k10: wt('l09', '10,000'), air: wt('l09', 'flowing'),
  k100: wt('l10', '100,000'), seal: wt('l10', 'seals'), world: wt('l10', 'wait'), cut: 28.0, red: 28.85,
  dive2a: 29.2, dive2b: 30.3, six: wt('l12', '666'), lock: wt('l12', 'locked'), back2a: 35.95, back2b: 37.1,
  card: wt('l13', 'comments'), pantry: wt('l13', 'pantry'), gens: wt('l13', 'generators'), beside: wt('l13', '666'),
  follow: wt('l14', 'Follow'), closes: wt('l14', 'before'), push0: 45.45, end: TL.DUR
};

// ---------- world geometry (cutaway) ----------
const VX0 = 280, VX1 = 800, VTOP = 520, VSHO = 790, VBOT = 1500, SURF = 300;
function vaultPath(c, ins) {
  const x0 = VX0 + ins, x1 = VX1 - ins, top = VTOP + ins * 1.25, sh = VSHO, b = VBOT - ins, mx = (VX0 + VX1) / 2;
  c.beginPath(); c.moveTo(x0, b); c.lineTo(x0, sh);
  c.bezierCurveTo(x0, sh - 150, mx - 90, top + 18, mx, top);
  c.bezierCurveTo(mx + 90, top + 18, x1, sh - 150, x1, sh);
  c.lineTo(x1, b); c.closePath();
}
const CW = 15, CH = 11, GX0 = 304, GY0 = 548;      // cell pitch and grid origin
const cellXY = (i, j) => [GX0 + i * CW, GY0 + j * CH];
const NCOL = Math.floor((VX1 - VX0 - 48) / CW), NROW = Math.floor((VBOT - GY0 - 30) / CH);
const SPINE = Math.floor(NCOL / 2);
const DOOR = { x: VX0 + 2, y: 900, r: 64 }, TUN = { x: -180, y: SURF - 10 };
const tunU = (() => { const dx = TUN.x - DOOR.x, dy = TUN.y - DOOR.y, l = Math.hypot(dx, dy); return [dx / l, dy / l]; })();
const LOOPC = [16, 40], DIVE1 = [21, 46], DIVE2 = [SPINE + 1, 10], YOURBED = [8, 63], SIXC = [SPINE, 3];
const cellCenter = ([i, j]) => { const [x, y] = cellXY(i, j); return [x + 5.5, y + 3.5]; };
const rnd = mulberry(7); const LIT = Array.from({ length: NCOL * NROW }, () => rnd());

// ---------- static backgrounds (world, scale .5) ----------
const BG = { x0: -1300, y0: -1500, w: 3700, h: 4600, s: 0.5 };
const [bgC, bgX] = mk(BG.w * BG.s, BG.h * BG.s);
(function buildBG() {
  const c = bgX, r = mulberry(11); c.scale(BG.s, BG.s); c.translate(-BG.x0, -BG.y0);
  let g = c.createLinearGradient(0, BG.y0, 0, SURF); g.addColorStop(0, P.sky0); g.addColorStop(1, P.sky1);
  c.fillStyle = g; c.fillRect(BG.x0, BG.y0, BG.w, SURF - BG.y0);
  c.filter = 'blur(60px)';
  for (let i = 0; i < 40; i++) { c.fillStyle = `rgba(${40 + r() * 30},${60 + r() * 40},${140 + r() * 60},${.18 + r() * .2})`; c.beginPath(); c.ellipse(BG.x0 + r() * BG.w, BG.y0 + r() * (SURF - BG.y0), 120 + r() * 260, 60 + r() * 140, 0, 0, TAU); c.fill(); }
  c.filter = 'none';
  for (let i = 0; i < 900; i++) { const y = BG.y0 + r() * (SURF - BG.y0 - 20); c.fillStyle = ['#C9D3FF', '#FFF1D6', '#9FB4FF'][i % 3]; c.globalAlpha = .35 + r() * .6; c.beginPath(); c.arc(BG.x0 + r() * BG.w, y, .8 + r() * 1.8, 0, TAU); c.fill(); }
  c.globalAlpha = 1;
  // earth strata
  g = c.createLinearGradient(0, SURF, 0, BG.y0 + BG.h); g.addColorStop(0, '#222C5A'); g.addColorStop(.25, '#18204A'); g.addColorStop(1, '#0C1129');
  c.fillStyle = g; c.fillRect(BG.x0, SURF, BG.w, BG.h);
  const bands = ['#1E2852', '#1A2349', '#161E40', '#131A38', '#111731', '#0F142C'];
  for (let k = 0; k < bands.length; k++) {
    const y = SURF + 90 + k * 260; c.fillStyle = bands[k]; c.beginPath(); c.moveTo(BG.x0, BG.y0 + BG.h);
    for (let x = BG.x0; x <= BG.x0 + BG.w; x += 40) c.lineTo(x, y + Math.sin(x * .004 + k) * 30 + vnoise(x * .01 + k * 9) * 40);
    c.lineTo(BG.x0 + BG.w, BG.y0 + BG.h); c.fill();
  }
  c.filter = 'blur(40px)';
  for (let i = 0; i < 70; i++) { c.fillStyle = `rgba(${50 + r() * 40},${50 + r() * 40},${110 + r() * 50},${.12 + r() * .15})`; c.beginPath(); c.ellipse(BG.x0 + r() * BG.w, SURF + 120 + r() * 3000, 100 + r() * 220, 40 + r() * 90, 0, 0, TAU); c.fill(); }
  c.filter = 'none';
  for (let i = 0; i < 260; i++) {                  // rocks: flat, one shade step
    const x = BG.x0 + r() * BG.w, y = SURF + 60 + r() * 3200, rx = 6 + r() * 26, ry = rx * (.5 + r() * .3);
    c.fillStyle = '#0D1330'; c.beginPath(); c.ellipse(x, y, rx, ry, r(), 0, TAU); c.fill();
    c.fillStyle = '#2A3566'; c.beginPath(); c.ellipse(x - rx * .15, y - ry * .2, rx * .8, ry * .7, r(), 0, TAU); c.fill();
  }
  // surface band
  c.fillStyle = '#2E3B74'; c.fillRect(BG.x0, SURF - 6, BG.w, 24); c.fillStyle = '#4C5CA4'; c.fillRect(BG.x0, SURF - 8, BG.w, 4);
})();

// ---------- camera ----------
const LCX = cellCenter(LOOPC);
const WIDE = { x: 540, y: 960, z: 0.92, r: 0 };
function logz(a, b, u) { return Math.exp(lerp(Math.log(a), Math.log(b), u)); }
function mixCam(a, b, u, uz = u) { return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: logz(a.z, b.z, uz), r: lerp(a.r, b.r, u) }; }
const ECU = { x: LCX[0], y: LCX[1], z: 13, r: 0 };
const D1 = { ...(() => { const c = cellCenter(DIVE1); return { x: c[0], y: c[1] }; })(), z: 290, r: 0 };
const D2 = { ...(() => { const c = cellCenter(DIVE2); return { x: c[0], y: c[1] }; })(), z: 290, r: 0 };
const breathe = t => ({ dr: Math.sin(t * .45) * .012, dy: Math.sin(t * .7) * 6 });
function camAt(t) {
  const b = breathe(t);
  const wide = (r) => ({ x: WIDE.x, y: WIDE.y + b.dy, z: WIDE.z, r: r + b.dr });
  if (t < T.pullEnd) { const u = eio(seg(t, .55, T.pullEnd)); return mixCam(ECU, wide(-.035), u, u); }
  if (t < 7.2) return wide(lerp(-.035, .03, ss(seg(t, 3.3, 7.2))));
  if (t < T.dive0) { const u = eio(seg(t, 7.2, 9.6)); return mixCam(wide(.03), { x: 470, y: 930, z: 1.12, r: .01 }, u); }
  if (t < T.back0) { const u = ei(seg(t, T.dive0, T.dive1 + .05)); return mixCam({ x: 470, y: 930, z: 1.12, r: .01 }, D1, ss(seg(t, T.dive0, T.dive0 + .6)), u); }
  if (t < 18.6) { const u = eo(seg(t, T.back0, T.back1 + .4)); return mixCam(D1, wide(0), ss(seg(t, T.back0 + .3, T.back1 + .4)), u); }
  if (t < 23.3) return wide(lerp(0, -.045, ss(seg(t, 18.6, 23.3))));
  if (t < 25.9) { const u = eio(seg(t, 23.3, 25.0)); return mixCam(wide(-.045), { x: 430, y: 930, z: 1.22, r: -.02 }, u); }
  if (t < T.cut) { const u = eio(seg(t, 25.9, 27.9)); return mixCam({ x: 430, y: 930, z: 1.22, r: -.02 }, { x: 540, y: 520, z: .55, r: 0 }, u); }
  if (t < T.dive2a) return { x: 540, y: 520, z: .55, r: 0 };
  if (t < T.back2a) { const u = ei(seg(t, T.dive2a, T.dive2b + .05)); return mixCam({ x: 540, y: 520, z: .55, r: 0 }, D2, ss(seg(t, T.dive2a, T.dive2a + .7)), u); }
  if (t < 42.0) { const u = eo(seg(t, T.back2a, T.back2b + .4)); return mixCam(D2, wide(.0), ss(seg(t, T.back2a + .3, T.back2b + .4)), u); }
  if (t < T.push0) return wide(lerp(0, .03, ss(seg(t, 42, 45.4))));
  const u = eio(seg(t, T.push0, T.end)); return mixCam(wide(.03), ECU, u, u);
}
// world → screen for the cutaway
function applyCam(c, cam, s = 1) { c.setTransform(s, 0, 0, s, 0, 0); c.translate(W / 2, H / 2); c.rotate(cam.r); c.scale(cam.z, cam.z); c.translate(-cam.x, -cam.y); }
function w2s(cam, x, y) { const dx = (x - cam.x) * cam.z, dy = (y - cam.y) * cam.z, c = Math.cos(cam.r), s = Math.sin(cam.r); return [W / 2 + dx * c - dy * s, H / 2 + dx * s + dy * c]; }

// ---------- state over time ----------
function state(t) {
  const reset = t > T.red;                      // after the twist, the promise is replayed from zero
  const S = {};
  S.lights = reset ? 0 : ss(seg(t, T.lights - .1, T.lights + .9));
  S.air = reset ? 0 : ss(seg(t, T.air - .2, T.air + .6));
  S.door = reset ? 0 : eio(seg(t, T.seal - .35, T.seal + .55));
  if (t > T.closes) S.door = eio(seg(t, T.closes, T.end + 2.5)) * .55;
  S.world = reset ? 0 : ss(seg(t, T.world - .3, T.world + 1.2));
  S.power = t < T.cut ? 1 : t < T.red ? .05 + (t > 28.7 && t < 28.76 ? .4 : 0) : 1;
  S.redTint = t < T.red ? 0 : t < T.back2a ? ss(seg(t, T.red, T.red + .35)) : 1 - ss(seg(t, T.back2a + .2, T.back2b));
  S.sweep = seg(t, T.sweep0, T.sweep1);
  S.six = t > T.back2a ? ss(seg(t, T.back2a, T.back2b)) * (1 - ss(seg(t, T.push0 + .6, T.end - .3))) : 0;
  S.pantry = ss(seg(t, T.pantry - .1, T.pantry + .4)) * (1 - ss(seg(t, T.follow - .4, T.follow + .3)));
  S.gens = ss(seg(t, T.gens - .1, T.gens + .4)) * (1 - ss(seg(t, T.follow - .4, T.follow + .3)));
  S.sixTag = ss(seg(t, T.beside - .05, T.beside + .35)) * (1 - ss(seg(t, T.follow - .4, T.follow + .3)));
  S.yours = seg(t, T.follow - .05, T.follow + .5) * (1 - ss(seg(t, T.push0 + .4, T.end - .4)));
  S.doorPing = t > T.doorPing && t < T.doorPing + 1.6 ? 1 - seg(t, T.doorPing, T.doorPing + 1.6) : 0;
  return S;
}
function counterAt(t) {
  const fmt = n => Math.round(n).toLocaleString('en-US');
  let show = (t > T.counterIn ? back(seg(t, T.counterIn, T.counterIn + .45)) : 0);
  if (t > T.cut) show = 0;
  if (t > T.back2b - .3) show = back(seg(t, T.back2b - .3, T.back2b + .15)) * (1 - ss(seg(t, T.push0 + .3, T.push0 + 1)));
  if (t < T.k1 || t > T.cut) return { show, tag: 'SURVIVORS INSIDE', txt: '0 / 100,000', pop: 0, roll: false };
  let v, roll = false, pop = 0;
  const r1 = [T.k1 - .1, T.k1 + .55], r2 = [T.k10 - .1, T.k10 + .55], r3 = [T.k100 - .1, T.k100 + .9];
  if (t < r2[0]) { v = 1000 * eo(seg(t, ...r1)); roll = t < r1[1]; pop = seg(t, r1[1], r1[1] + .3); }
  else if (t < r3[0]) { v = lerp(1000, 10000, eo(seg(t, ...r2))); roll = t < r2[1]; pop = seg(t, r2[1], r2[1] + .3); }
  else { v = lerp(10000, 100000, eo(seg(t, ...r3))); roll = t < r3[1]; pop = seg(t, r3[1], r3[1] + .3); }
  return { show, tag: 'GOAL: SURVIVORS', txt: fmt(v), pop: pop > 0 && pop < 1 ? Math.sin(pop * Math.PI) : 0, roll };
}

// ---------- drawing helpers ----------
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function glowDot(c, x, y, r, col, a = 1) { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); c.globalAlpha = a; c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); c.globalAlpha = 1; }
const TEXTS = [];
function tag(c, x, y, text, col, a = 1, size = 20, plate = true, id) {
  if (a <= 0.01) return;
  c.save(); c.globalAlpha = a; c.font = `600 ${size}px Fredoka`; c.letterSpacing = '2px';
  const w = c.measureText(text).width + size * 1.1, h = size * 1.6;
  if (plate) { rr(c, x - w / 2, y - h / 2, w, h, h * .32); c.fillStyle = P.plate; c.fill(); c.lineWidth = 2; c.strokeStyle = col; c.globalAlpha = a * .7; c.stroke(); c.globalAlpha = a; }
  c.fillStyle = col; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, x, y + 1); c.restore();
  return [w, h];
}

// ---------- the cutaway ----------
function drawCutaway(t, cam, S) {
  const c = cutX, g = cutG;
  c.setTransform(1, 0, 0, 1, 0, 0); g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, W * G, H * G);
  applyCam(c, cam); applyCam(g, cam, G);
  // background
  c.drawImage(bgC, BG.x0, BG.y0, BG.w, BG.h);
  // end-of-world horizon glow
  if (S.world > 0) {
    const pulse = .85 + .15 * Math.sin(t * 9);
    for (const k of [c, g]) { k.save(); k.beginPath(); k.rect(-2000, -2000, 5000, 2000 + SURF - 6); k.clip(); glowDot(k, 540, SURF, 900, 'rgba(255,110,50,.85)', S.world * pulse * (k === g ? 1 : .7)); glowDot(k, 140, SURF, 380, 'rgba(255,170,80,.9)', S.world * pulse * .6); k.restore(); }
  }
  // tunnel to the surface
  c.save(); c.lineCap = 'butt';
  c.strokeStyle = P.shellS; c.lineWidth = 150; c.beginPath(); c.moveTo(DOOR.x + 30, DOOR.y); c.lineTo(TUN.x, TUN.y); c.stroke();
  c.strokeStyle = '#10183A'; c.lineWidth = 124; c.stroke();
  c.setLineDash([10, 10]); c.strokeStyle = P.amber; c.lineWidth = 2.5; c.globalAlpha = .8;
  for (const o of [-48, 48]) { c.beginPath(); c.moveTo(DOOR.x + 30 - tunU[1] * o, DOOR.y + tunU[0] * o); c.lineTo(TUN.x - tunU[1] * o, TUN.y + tunU[0] * o); c.stroke(); }
  c.restore();
  // shaft + hatch
  c.fillStyle = P.shellS; c.fillRect(518, SURF - 4, 44, VTOP - SURF + 20); c.fillStyle = '#10183A'; c.fillRect(528, SURF + 8, 24, VTOP - SURF + 10);
  c.fillStyle = P.shell; c.beginPath(); c.ellipse(540, SURF - 4, 46, 20, 0, Math.PI, 0); c.fill();
  // buttresses (one shade step)
  for (const sgn of [-1, 1]) {
    const xw = sgn < 0 ? VX0 : VX1, xo = sgn < 0 ? 110 : 970;
    c.fillStyle = P.shellS; c.beginPath(); c.moveTo(xw, 1040); c.lineTo(xo, VBOT - 6); c.lineTo(xw, VBOT); c.closePath(); c.fill();
    c.fillStyle = P.shell; c.beginPath(); c.moveTo(xw, 1060); c.lineTo(xo + sgn * -14, VBOT - 14); c.lineTo(xw, VBOT - 50); c.closePath(); c.fill();
    c.strokeStyle = P.amber; c.lineWidth = 4; c.beginPath(); c.moveTo(xw, 1046); c.lineTo(xo + sgn * -6, VBOT - 10); c.stroke();
  }
  // shell rim glow
  vaultPath(g, -6); g.lineWidth = 16; g.strokeStyle = 'rgba(127,227,255,.75)'; g.stroke();
  // shell
  vaultPath(c, 0); c.fillStyle = P.shellS; c.fill();
  c.save(); vaultPath(c, 0); c.clip(); c.translate(-7, -9); vaultPath(c, 0); c.fillStyle = P.shell; c.fill(); c.restore();
  vaultPath(c, 0); c.lineWidth = 3; c.strokeStyle = '#EAF6FF'; c.stroke();
  // interior + cells
  vaultPath(c, 22); c.fillStyle = P.inner; c.fill();
  c.save(); vaultPath(c, 22); c.clip();
  const sweepY = lerp(VTOP - 60, VBOT + 60, S.sweep), sweepOn = S.sweep > 0 && S.sweep < 1;
  for (let j = 0; j < NROW; j++) {
    const [, y] = cellXY(0, j);
    if (j % 9 === 8) { c.fillStyle = P.slab; c.fillRect(VX0, y, VX1 - VX0, CH - 2); continue; }
    for (let i = 0; i < NCOL; i++) {
      if (i === SPINE) continue;
      const [x] = cellXY(i, j); const lit = LIT[j * NCOL + i];
      let col = P.cell;
      if (S.lights > 0 && lit < .42 * S.lights) col = lit < .14 ? '#FFD27A' : '#C9A35A';
      c.fillStyle = col; rr(c, x, y, 11, 7, 1.6); c.fill();
      if (col !== P.cell) { g.fillStyle = 'rgba(255,190,90,.9)'; g.fillRect(x - 2, y - 2, 15, 11); }
    }
  }
  if (sweepOn) { const gr = c.createLinearGradient(0, sweepY - 60, 0, sweepY + 20); gr.addColorStop(0, 'rgba(127,227,255,0)'); gr.addColorStop(.8, 'rgba(127,227,255,.45)'); gr.addColorStop(1, 'rgba(200,245,255,.9)'); c.fillStyle = gr; c.fillRect(VX0, sweepY - 60, VX1 - VX0, 80); g.fillStyle = 'rgba(127,227,255,.8)'; g.fillRect(VX0, sweepY - 10, VX1 - VX0, 14); }
  c.fillStyle = P.slab; c.fillRect(cellXY(SPINE, 0)[0], VTOP, 11, VBOT - VTOP);
  // air: cyan flecks rising in two vents
  if (S.air > 0) for (let k = 0; k < 70; k++) {
    const vx = k % 2 ? 330 : 750, ph = hash(k * 3.1), y = VBOT - ((t * 120 + ph * 900) % 900);
    c.globalAlpha = S.air * .8; c.fillStyle = P.cyan; c.fillRect(vx + (hash(k) - .5) * 30, y, 2.5, 9); g.globalAlpha = S.air; g.fillStyle = P.cyan; g.fillRect(vx - 6, y, 12, 14); c.globalAlpha = g.globalAlpha = 1;
  }
  // zones (pick your spot)
  if (S.pantry > 0) { c.globalAlpha = S.pantry; c.fillStyle = P.cyan; rr(c, VX0 + 26, 760, 9, 690, 4); c.fill(); rr(c, VX1 - 35, 760, 9, 690, 4); c.fill(); g.globalAlpha = S.pantry; g.fillStyle = P.cyan; g.fillRect(VX0 + 20, 760, 22, 690); g.fillRect(VX1 - 42, 760, 22, 690); c.globalAlpha = g.globalAlpha = 1; }
  if (S.gens > 0) { c.globalAlpha = S.gens; c.fillStyle = P.gold; rr(c, 360, VBOT - 52, 360, 22, 8); c.fill(); g.globalAlpha = S.gens; g.fillStyle = P.gold; g.fillRect(350, VBOT - 60, 380, 38); c.globalAlpha = g.globalAlpha = 1; }
  c.restore();
  // amber dashed inner outline
  c.save(); vaultPath(c, 12); c.setLineDash([12, 9]); c.lineWidth = 3; c.strokeStyle = P.amber; c.stroke(); c.restore();
  // base vents and corner lights
  for (const x of [430, 540, 650]) { c.fillStyle = '#B8C3D6'; rr(c, x - 30, VBOT - 2, 60, 12, 5); c.fill(); glowDot(g, x, VBOT + 8, 26, 'rgba(127,227,255,.8)', .5 + .5 * S.air); }
  const blink = k => .55 + .45 * Math.max(0, Math.sin(t * 2.2 - k * 1.3));
  for (const [x, y, k] of [[118, VBOT - 6, 0], [962, VBOT - 6, 1], [540, VTOP + 6, 2]]) { c.fillStyle = '#F4FBFF'; c.beginPath(); c.arc(x, y, 6, 0, TAU); c.fill(); glowDot(g, x, y, 26, k === 2 ? 'rgba(200,240,255,1)' : 'rgba(150,255,210,1)', blink(k)); }
  // blast door

  TEXTS.push({ id: 'card', text: 'your_user Me by the pantry!', x0: 250, y0: 1186, x1: 830, y1: 1294 });
}

// ---------- frame ----------
function cellScreenRect(cam, cell) { const [x, y] = cellXY(...cell); const a = w2s(cam, x, y), b = w2s(cam, x + 11, y + 7); return [a[0], a[1], b[0] - a[0], b[1] - a[1]]; }
window.render = (t) => {
  TEXTS.length = 0;
  const cam = camAt(t), S = state(t);
  ctxLabels = ctx;
  // which corridor, and how much of it
  let cor = null;
  if (t >= T.dive0 && t < T.back1 + .5) cor = { red: false, cell: DIVE1 };
  if (t >= T.dive2a && t < T.back2b + .5) cor = { red: true, cell: DIVE2 };
  let full = false;
  if (cor) { const [, , rw, rh] = cellScreenRect(cam, cor.cell); full = rh >= H - 1; }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!full) { drawCutaway(t, cam, S); ctx.drawImage(cutC, 0, 0); }
  if (cor) {
    const [rx, ry, rw, rh] = cellScreenRect(cam, cor.cell), s = Math.min(1, rh / H);
    const alpha = ss(seg(cam.z, 14, 60));
    if (alpha > 0) {
      drawCorridor(t, cor.red);
      ctx.save(); if (!full) { ctx.beginPath(); ctx.rect(rx, ry, rw, rh); ctx.clip(); }
      ctx.globalAlpha = alpha; const dw = W * s, dh = H * s; ctx.drawImage(corC, rx + rw / 2 - dw / 2, ry + rh / 2 - dh / 2, dw, dh); ctx.restore();
    }
  }
  if (!full) labels.forEach(f => f());
  commentCard(t);
  captions(t);
  // loop seam: a 2-frame dip at the very end
  if (t > T.end - .07) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, H); }
};
window.TEXTS = (t) => { window.render(t); return TEXTS.slice(); };

const ev = (t, type, o = {}) => EV.push({ t: +t.toFixed(3), type, ...o });
ev(.55, 'whoosh', { d: 2.6, v: .7 }); ev(T.sweep0, 'sweep', { d: T.sweep1 - T.sweep0 }); ev(T.doorPing, 'ping', { v: .6 }); ev(T.counterIn, 'pop');
ev(T.dive0, 'dive', { d: 1.1 }); ev(T.you, 'chime'); ev(T.handle, 'pop'); ev(T.back0, 'whoosh', { d: 1.2, v: .6, rev: 1 });
for (const k of [T.k1, T.k10, T.k100]) { ev(k - .1, 'ticks', { d: k === T.k100 ? 1.0 : .65 }); }
ev(T.lights, 'clunk'); ev(T.lights + .05, 'hum'); ev(T.air, 'air', { d: T.cut - T.air });
ev(T.seal - .35, 'roll', { d: .9 }); ev(T.seal + .55, 'slam'); ev(T.world, 'rumble', { d: T.cut - T.world });
ev(T.cut, 'powerdown'); ev(T.red, 'hit'); ev(T.dive2a, 'dive', { d: 1.1, v: .7 }); ev(T.red + .2, 'redhum', { d: T.back2a - T.red });
ev(T.six, 'creak'); ev(T.lock + .1, 'latch'); ev(T.back2a, 'whoosh', { d: 1.2, v: .6, rev: 1 }); ev(T.card, 'pop');
ev(T.pantry, 'ping', { v: .5 }); ev(T.gens, 'ping', { v: .5, p: 1.25 }); ev(T.beside, 'lowping'); ev(T.follow, 'chime', { v: .6 });
ev(T.closes, 'roll', { d: 3.0, v: .5 }); ev(T.push0 - .5, 'riser', { d: T.end - T.push0 + .5 });

window.T = T;
